<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="100%" height="100%">
  <defs>
    <!-- Hatch pattern for steel pipe cross section -->
    <pattern id="steel-hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1e3d59" stroke-width="1" />
    </pattern>
    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3d59" />
    </marker>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
  </defs>

  <!-- Cream background -->
  <rect width="100%" height="100%" fill="#f2efe3" />

  <!-- Title / Figure label -->
  <text x="40" y="26" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1c1c1c">Fig. 4 — Structural Yield: Steel Pipe vs. Compliant Blood Vessel</text>

  <!-- Grid lines -->
  <line x1="40" y1="36" x2="760" y2="36" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="600" x2="760" y2="600" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="400" y1="42" x2="400" y2="490" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <!-- SECTION 1: STEEL PIPE UNDER PRESSURE (LEFT) -->
  <g transform="translate(0, 0)">
    <text x="50" y="56" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">A: Steel Pipe (Elastic Yield &amp; Rupture)</text>

    <!-- 3D Isometric Cylinder Pipe -->
    <g transform="translate(30, 60)">
      <!-- Casing body lines -->
      <ellipse cx="270" cy="80" rx="10" ry="25" fill="none" stroke="#1e3d59" stroke-width="1.5" stroke-dasharray="3,3" />
      <line x1="90" y1="55" x2="270" y2="55" stroke="#1e3d59" stroke-width="2" />
      <line x1="90" y1="105" x2="270" y2="105" stroke="#1e3d59" stroke-width="2" />

      <!-- Jagged Yield Split/Fracture in the middle -->
      <path d="M 150 55 L 165 52 L 180 58 L 195 53 L 210 56 L 225 55" fill="none" stroke="#1e3d59" stroke-width="2.5" />
      <path d="M 180 40 L 180 50" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <path d="M 180 70 L 180 60" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <path d="M 205 40 L 205 50" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <path d="M 205 70 L 205 60" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <text x="188" y="36" font-family="Georgia, serif" font-size="14" fill="#1e3d59">yield</text>

      <!-- Front open face cylinder -->
      <path d="M 90 55 C 80 55, 75 66, 75 80 C 75 94, 80 105, 90 105" fill="none" stroke="#1e3d59" stroke-width="2" />
      <ellipse cx="90" cy="80" rx="8" ry="22" fill="url(#steel-hatch)" stroke="#1e3d59" stroke-width="1.5" />
      <ellipse cx="90" cy="80" rx="6" ry="17" fill="#f2efe3" stroke="#1e3d59" stroke-width="1.5" />

      <!-- Internal Pressure arrows -->
      <path d="M 90 80 L 90 66" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <path d="M 90 80 L 90 94" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <path d="M 90 80 L 82 80" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <path d="M 90 80 L 98 80" stroke="#1e3d59" stroke-width="1.4" marker-end="url(#arrow-blue)" />
      <text x="102" y="86" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#1e3d59">P</text>

      <!-- Label r and t -->
      <line x1="98" y1="60" x2="118" y2="42" stroke="#1e3d59" stroke-width="1.2" />
      <text x="120" y="40" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#1e3d59">t</text>
      <line x1="90" y1="80" x2="90" y2="102" stroke="#1e3d59" stroke-width="1.2" />
      <circle cx="90" cy="80" r="2.5" fill="#1e3d59" />
      <circle cx="90" cy="102" r="2.5" fill="#1e3d59" />
      <text x="98" y="100" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#1e3d59">r</text>
    </g>

    <!-- Stress-Strain Graph (Bottom Left) -->
    <g transform="translate(0, 200)">
      <!-- Axes -->
      <line x1="80" y1="230" x2="340" y2="230" stroke="#1c1c1c" stroke-width="1.2" marker-end="url(#arrow-charcoal)" />
      <line x1="80" y1="80" x2="80" y2="230" stroke="#1c1c1c" stroke-width="1.2" marker-end="url(#arrow-charcoal)" />
      
      <text x="40" y="155" font-family="Georgia, serif" font-size="15" fill="#1c1c1c" transform="rotate(-90 40 155)" text-anchor="middle">Stress <tspan font-style="italic">σ</tspan></text>
      <text x="280" y="218" font-family="Georgia, serif" font-size="15" fill="#1c1c1c" text-anchor="middle">Strain <tspan font-style="italic">ε</tspan></text>

      <!-- Hookean Curve -->
      <path d="M 80 230 L 180 110 C 190 108, 195 106, 200 105 L 200 230" fill="none" stroke="#1e3d59" stroke-width="2.5" />
      <line x1="200" y1="105" x2="200" y2="230" stroke="#1e3d59" stroke-width="1.5" stroke-dasharray="3,3" />

      <!-- Labels on Graph -->
      <circle cx="180" cy="110" r="4" fill="#1e3d59" />
      <text x="95" y="100" font-family="Georgia, serif" font-size="15" fill="#1e3d59">Yield Point</text>
      <circle cx="200" cy="105" r="4" fill="#c94a4a" />
      <text x="210" y="108" font-family="Georgia, serif" font-size="15" fill="#c94a4a">Fracture</text>
    </g>

    <!-- Equation Hoop Stress + definitions -->
    <g transform="translate(50, 455)">
      <rect x="0" y="0" width="300" height="125" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="3" />
      <text x="24" y="34" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#1c1c1c">
        <tspan font-style="italic">σ<tspan font-size="13" dy="5">θ</tspan></tspan><tspan dy="-5"> = </tspan><tspan font-style="italic">P r</tspan> / <tspan font-style="italic">t</tspan>
      </text>
      <text x="24" y="62" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">
        <tspan font-style="italic">σ<tspan font-size="10" dy="3">θ</tspan></tspan><tspan dy="-3"> = hoop (circumferential) stress</tspan>
      </text>
      <text x="24" y="82" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">
        <tspan font-style="italic">P</tspan> = internal pressure · <tspan font-style="italic">r</tspan> = radius
      </text>
      <text x="24" y="102" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">
        <tspan font-style="italic">t</tspan> = wall thickness
      </text>
    </g>
  </g>

  <!-- SECTION 2: LIVING VESSEL & ANEURYSM (RIGHT) -->
  <g transform="translate(400, 0)">
    <text x="30" y="56" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">B: Blood Vessel (Compliance &amp; Aneurysm)</text>

    <!-- Vessel Sketch -->
    <g transform="translate(20, 60)">
      <path d="M 20 50 L 110 50" stroke="#3a3a3a" stroke-width="2.2" fill="none" />
      <path d="M 20 44 L 110 44" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="2,2" />
      <path d="M 20 110 L 110 110" stroke="#3a3a3a" stroke-width="2.2" fill="none" />
      <path d="M 20 116 L 110 116" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="2,2" />

      <!-- Aneurysm Bulge -->
      <path d="M 110 50 C 130 50, 140 10, 180 10 C 220 10, 230 50, 250 50 L 290 50" stroke="#3a3a3a" stroke-width="1.6" fill="none" />
      <path d="M 110 110 C 130 110, 140 150, 180 150 C 220 150, 230 110, 250 110 L 290 110" stroke="#3a3a3a" stroke-width="1.6" fill="none" />

      <path d="M 140 16 C 160 14, 170 12, 180 12 C 190 12, 200 14, 220 16" stroke="#5a5a5a" stroke-width="0.8" fill="none" />
      <path d="M 140 144 C 160 146, 170 148, 180 148 C 190 148, 200 146, 220 144" stroke="#5a5a5a" stroke-width="0.8" fill="none" />

      <!-- Hatching -->
      <path d="M 30 44 L 36 50 M 50 44 L 56 50 M 70 44 L 76 50 M 90 44 L 96 50" stroke="#5a5a5a" stroke-width="1" />
      <path d="M 30 116 L 36 110 M 50 116 L 56 110 M 70 116 L 76 110 M 90 116 L 96 110" stroke="#5a5a5a" stroke-width="1" />
      <path d="M 155 25 L 165 17 M 175 22 L 185 12 M 195 25 L 205 17" stroke="#5a5a5a" stroke-width="0.8" opacity="0.7" />
      <path d="M 155 135 L 165 143 M 175 138 L 185 148 M 195 135 L 205 143" stroke="#5a5a5a" stroke-width="0.8" opacity="0.7" />

      <!-- Labels: normal segment -->
      <line x1="50" y1="80" x2="50" y2="50" stroke="#3a3a3a" stroke-width="1.4" />
      <circle cx="50" cy="80" r="2.5" fill="#3a3a3a" />
      <circle cx="50" cy="50" r="2.5" fill="#3a3a3a" />
      <text x="56" y="72" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#3a3a3a">r</text>
      <text x="58" y="34" font-family="Georgia, serif" font-size="15" fill="#3a3a3a">wall thickness <tspan font-style="italic" font-weight="bold">t</tspan></text>

      <!-- Labels: aneurysm -->
      <line x1="180" y1="80" x2="180" y2="10" stroke="#3a3a3a" stroke-width="1.4" stroke-dasharray="3,3" />
      <circle cx="180" cy="80" r="2.5" fill="#3a3a3a" />
      <circle cx="180" cy="10" r="2.5" fill="#3a3a3a" />
      <text x="188" y="52" font-family="Georgia, serif" font-size="18" font-style="italic" font-weight="bold" fill="#3a3a3a">r′</text>
      <text x="210" y="22" font-family="Georgia, serif" font-size="15" fill="#c94a4a">thinning <tspan font-style="italic" font-weight="bold" fill="#c94a4a">t′</tspan></text>
      <text x="122" y="88" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#c94a4a">Aneurysm</text>
    </g>

    <!-- Nonlinear Compliance Graph (Bottom Right) -->
    <g transform="translate(20, 200)">
      <!-- Axes -->
      <line x1="80" y1="230" x2="340" y2="230" stroke="#1c1c1c" stroke-width="1.2" marker-end="url(#arrow-charcoal)" />
      <line x1="80" y1="80" x2="80" y2="230" stroke="#1c1c1c" stroke-width="1.2" marker-end="url(#arrow-charcoal)" />
      
      <text x="40" y="155" font-family="Georgia, serif" font-size="15" fill="#1c1c1c" transform="rotate(-90 40 155)" text-anchor="middle">Volume <tspan font-style="italic">V</tspan></text>
      <text x="280" y="218" font-family="Georgia, serif" font-size="15" fill="#1c1c1c" text-anchor="middle">Pressure <tspan font-style="italic">P</tspan></text>

      <!-- Compliance Curve -->
      <path d="M 80 230 C 130 220, 180 180, 220 120 C 240 90, 270 90, 310 90" fill="none" stroke="#c94a4a" stroke-width="2.5" />
      
      <!-- Slope callouts -->
      <path d="M 140 198 L 175 198 L 175 168" stroke="#5a5a5a" stroke-width="1.2" fill="none" />
      <text x="178" y="190" font-family="Georgia, serif" font-size="14" fill="#5a5a5a">High compliance <tspan font-style="italic">C</tspan></text>

      <path d="M 250 90 L 290 90 L 290 98" stroke="#5a5a5a" stroke-width="1.2" fill="none" />
      <text x="230" y="76" font-family="Georgia, serif" font-size="14" fill="#c94a4a">Stiffening (low <tspan font-style="italic">C</tspan>)</text>
    </g>

    <!-- Equation Compliance + definitions -->
    <g transform="translate(50, 455)">
      <rect x="0" y="0" width="300" height="125" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="3" />
      <text x="24" y="34" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#1c1c1c">
        <tspan font-style="italic">C</tspan> = Δ<tspan font-style="italic">V</tspan> / Δ<tspan font-style="italic">P</tspan>
      </text>
      <text x="24" y="62" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">
        <tspan font-style="italic">C</tspan> = compliance (volume stretch with pressure)
      </text>
      <text x="24" y="82" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">
        Δ<tspan font-style="italic">V</tspan> = change in volume
      </text>
      <text x="24" y="102" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">
        Δ<tspan font-style="italic">P</tspan> = change in pressure
      </text>
    </g>
  </g>
</svg>
