<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 920" width="100%" height="100%">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1c1c1c" />
    </marker>
    <marker id="flow-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e3d59" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f2efe3" />
  
  <text x="300" y="40" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Fig. 2b — Acoustic Signatures</text>

  <!-- TOP: Vascular Bruit (Medical) -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="500" height="390" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="32" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#3a3a3a" text-anchor="middle">Vascular Bruit</text>
    
    <!-- Artery with stenosis -->
    <path d="M 50 170 C 200 170, 230 210, 250 210 C 270 210, 300 170, 450 170" fill="none" stroke="#5a5a5a" stroke-width="4" />
    <path d="M 50 250 C 200 250, 230 220, 250 220 C 270 220, 300 250, 450 250" fill="none" stroke="#5a5a5a" stroke-width="4" />
    
    <!-- Primary flow direction (left → right through stenosis) -->
    <path d="M 70 210 L 130 210" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <path d="M 145 210 L 200 210" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <path d="M 310 210 L 370 210" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <path d="M 385 210 L 430 210" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <text x="100" y="198" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1c1c1c">flow</text>

    <!-- Stethoscope bell (below panel title) -->
    <path d="M 230 150 L 270 150 L 260 130 L 240 130 Z" fill="#e8e2d8" stroke="#3a3a3a" stroke-width="2" />
    <path d="M 250 130 L 250 90 C 250 70, 270 60, 290 60 L 400 60" fill="none" stroke="#3a3a3a" stroke-width="2.5" />
    <text x="410" y="65" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Stethoscope</text>

    <!-- Turbulence Waves (downstream of stenosis) -->
    <path d="M 260 235 C 290 200, 330 250, 360 210 C 390 180, 420 230, 440 220" fill="none" stroke="#c94a4a" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Waveform Box -->
    <rect x="50" y="280" width="400" height="80" fill="#f2efe3" stroke="#3a3a3a" stroke-width="1.5" rx="3" />
    <!-- Low-frequency chaotic wave (amplitude kept inside box: y 288–352) -->
    <path d="M 55 320 L 80 302 L 105 335 L 130 308 L 155 338 L 180 300 L 205 342 L 230 305 L 255 340 L 280 298 L 305 336 L 330 310 L 355 338 L 380 305 L 405 330 L 430 312 L 445 320" fill="none" stroke="#3a3a3a" stroke-width="2.5" />
    <text x="250" y="380" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5a5a5a" text-anchor="middle">Continuous Low-Frequency Murmur</text>
  </g>

  <!-- BOTTOM: Well Knocking (Engineering) -->
  <g transform="translate(50, 490)">
    <rect x="0" y="0" width="500" height="380" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="32" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e3d59" text-anchor="middle">Wellbore Knocking</text>
    
    <!-- Steel Pipe with valve/restriction -->
    <rect x="50" y="150" width="400" height="80" fill="none" stroke="#1c1c1c" stroke-width="2.5" />
    <path d="M 50 150 L 450 150 M 50 230 L 450 230" stroke="#1c1c1c" stroke-width="2.5" />
    
    <!-- Valve / Choke -->
    <path d="M 230 150 L 270 150 L 270 180 L 230 180 Z" fill="#1e3d59" />
    <path d="M 230 230 L 270 230 L 270 200 L 230 200 Z" fill="#1e3d59" />
    
    <!-- Primary flow direction (left → right toward choke) -->
    <path d="M 70 190 L 130 190" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <path d="M 145 190 L 210 190" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <path d="M 290 190 L 350 190" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <path d="M 365 190 L 425 190" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <text x="100" y="178" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">flow</text>

    <!-- Acoustic Sensor / Geophone -->
    <rect x="180" y="120" width="30" height="30" fill="#1c1c1c" />
    <line x1="195" y1="120" x2="195" y2="70" stroke="#1c1c1c" stroke-width="3" />
    <circle cx="195" cy="70" r="6" fill="#1e3d59" />
    <text x="215" y="75" font-family="Georgia, serif" font-size="12" fill="#1e3d59">Acoustic Sensor</text>

    <!-- Reflected Shockwaves -->
    <path d="M 220 170 A 30 30 0 0 0 220 210" fill="none" stroke="#c94a4a" stroke-width="2.5" stroke-dasharray="6,4" />
    <path d="M 190 155 A 50 50 0 0 0 190 225" fill="none" stroke="#c94a4a" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Waveform Box -->
    <rect x="50" y="270" width="400" height="80" fill="#f2efe3" stroke="#1c1c1c" stroke-width="1.5" rx="3" />
    <!-- Sharp transient spike (amplitude kept inside box: y 278–342) -->
    <path d="M 55 310 L 150 310 L 160 278 L 170 342 L 180 285 L 190 335 L 200 292 L 210 325 L 220 300 L 230 310 L 445 310" fill="none" stroke="#1e3d59" stroke-width="2" />
    <text x="250" y="370" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59" text-anchor="middle">High-Amplitude Transient Spike</text>
  </g>

</svg>
