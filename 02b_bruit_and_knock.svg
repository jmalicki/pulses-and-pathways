<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#faf8f5" />
  <line x1="40" y1="40" x2="760" y2="40" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="410" x2="760" y2="410" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  
  <text x="50" y="35" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">Fig. 2b — Acoustic Signatures: Bruit vs. Knocking</text>

  <!-- LEFT: Vascular Bruit (Medical) -->
  <g transform="translate(40, 70)">
    <text x="160" y="5" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#3a3a3a" text-anchor="middle">Vascular Bruit</text>
    
    <!-- Artery with stenosis -->
    <path d="M 40 100 C 120 100, 140 130, 160 130 C 180 130, 200 100, 280 100" fill="none" stroke="#5a5a5a" stroke-width="3" />
    <path d="M 40 160 C 120 160, 140 140, 160 140 C 180 140, 200 160, 280 160" fill="none" stroke="#5a5a5a" stroke-width="3" />
    
    <!-- Stethoscope bell -->
    <path d="M 140 85 L 180 85 L 170 70 L 150 70 Z" fill="#e8e2d8" stroke="#3a3a3a" stroke-width="2" />
    <path d="M 160 70 L 160 40 C 160 30, 170 20, 180 20 L 220 20" fill="none" stroke="#3a3a3a" stroke-width="2" />
    <text x="225" y="24" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">Stethoscope</text>

    <!-- Turbulence Waves -->
    <path d="M 170 145 C 190 120, 210 160, 230 130 C 250 110, 270 150, 290 140" fill="none" stroke="#c94a4a" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 180 155 C 200 130, 220 170, 240 140 C 260 120, 280 160, 300 150" fill="none" stroke="#c94a4a" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Waveform Box -->
    <rect x="40" y="200" width="240" height="100" fill="#faf8f5" stroke="#3a3a3a" stroke-width="1.5" rx="3" />
    <!-- Low-frequency chaotic wave -->
    <path d="M 40 250 Q 55 230, 70 260 T 100 240 T 130 265 T 160 235 T 190 270 T 220 240 T 250 260 T 280 250" fill="none" stroke="#3a3a3a" stroke-width="2" />
    <text x="160" y="320" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a5a5a" text-anchor="middle">Continuous Low-Frequency Murmur</text>
  </g>

  <!-- RIGHT: Well Knocking (Engineering) -->
  <g transform="translate(440, 70)">
    <text x="160" y="5" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e3d59" text-anchor="middle">Wellbore Knocking</text>
    
    <!-- Steel Pipe with valve/restriction -->
    <rect x="40" y="100" width="240" height="60" fill="none" stroke="#1c1c1c" stroke-width="2" />
    <path d="M 40 100 L 280 100 M 40 160 L 280 160" stroke="#1c1c1c" stroke-width="2" />
    <!-- Valve / Choke -->
    <path d="M 150 100 L 170 100 L 170 120 L 150 120 Z" fill="#1e3d59" />
    <path d="M 150 160 L 170 160 L 170 140 L 150 140 Z" fill="#1e3d59" />
    
    <!-- Acoustic Sensor / Geophone -->
    <rect x="110" y="80" width="20" height="20" fill="#1c1c1c" />
    <line x1="120" y1="80" x2="120" y2="40" stroke="#1c1c1c" stroke-width="2" />
    <circle cx="120" cy="40" r="4" fill="#1e3d59" />
    <text x="135" y="44" font-family="Georgia, serif" font-size="11" fill="#1e3d59">Acoustic Sensor</text>

    <!-- Reflected Shockwaves -->
    <path d="M 140 110 A 20 20 0 0 0 140 150" fill="none" stroke="#c94a4a" stroke-width="2" stroke-dasharray="4,2" />
    <path d="M 125 100 A 30 30 0 0 0 125 160" fill="none" stroke="#c94a4a" stroke-width="1.5" stroke-dasharray="4,2" />

    <!-- Waveform Box -->
    <rect x="40" y="200" width="240" height="100" fill="#faf8f5" stroke="#1c1c1c" stroke-width="1.5" rx="3" />
    <!-- Sharp transient spike (water hammer) -->
    <path d="M 40 250 L 110 250 L 115 210 L 120 290 L 125 220 L 130 280 L 135 230 L 140 270 L 145 240 L 150 260 L 155 250 L 280 250" fill="none" stroke="#1e3d59" stroke-width="1.5" />
    <text x="160" y="320" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1e3d59" text-anchor="middle">High-Amplitude Transient Spike</text>
  </g>

</svg>
