<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 980" width="100%" height="100%">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1c1c1c" />
    </marker>
    <marker id="flow-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1e3d59" />
    </marker>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1c1c1c" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3" />
  <text x="300" y="36" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Fig. 2 &#8212; Shut-In Transients</text>

  <!-- TOP: Clamp shut-in (medical) -->
  <g transform="translate(50, 55)">
    <rect x="0" y="0" width="500" height="260" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="28" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#3a3a3a" text-anchor="middle">Clamp Shut-In</text>

    <!-- Straight vessel -->
    <path d="M 40 100 L 460 100" fill="none" stroke="#5a5a5a" stroke-width="3.5" />
    <path d="M 40 170 L 460 170" fill="none" stroke="#5a5a5a" stroke-width="3.5" />

    <!-- Fully closed clamp (bars meet; no gap) -->
    <rect x="248" y="88" width="18" height="47" fill="#1c1c1c" rx="2" />
    <rect x="248" y="135" width="18" height="47" fill="#1c1c1c" rx="2" />
    <rect x="242" y="128" width="30" height="14" fill="#3a3a3a" rx="2" />
    <text x="263" y="80" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" text-anchor="middle">clamp</text>

    <!-- Flow stops at clamp -->
    <path d="M 60 135 L 120 135" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <path d="M 135 135 L 200 135" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <path d="M 215 135 L 240 135" stroke="#1c1c1c" stroke-width="2" marker-end="url(#flow-arrow)" />
    <text x="100" y="124" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1c1c1c">flow</text>
    <text x="360" y="138" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a5a5a">no flow</text>

    <!-- Upstream reflected pressure waves -->
    <path d="M 240 115 A 28 28 0 0 0 240 155" fill="none" stroke="#c94a4a" stroke-width="2.2" stroke-dasharray="5,4" />
    <path d="M 220 105 A 42 42 0 0 0 220 165" fill="none" stroke="#c94a4a" stroke-width="1.8" stroke-dasharray="5,4" />
    <path d="M 200 98 A 55 55 0 0 0 200 172" fill="none" stroke="#c94a4a" stroke-width="1.5" stroke-dasharray="5,4" />
    <text x="145" y="200" font-family="Georgia, serif" font-size="12" fill="#c94a4a">reflected wave</text>
  </g>

  <!-- BOTTOM: Valve shut-in (petroleum) -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="500" height="260" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="28" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1e3d59" text-anchor="middle">Valve Shut-In</text>

    <!-- Steel pipe -->
    <rect x="40" y="100" width="420" height="70" fill="none" stroke="#1c1c1c" stroke-width="2.5" />
    <path d="M 40 100 L 460 100 M 40 170 L 460 170" stroke="#1c1c1c" stroke-width="2.5" />

    <!-- Fully closed valve (blocks meet at mid-line) -->
    <path d="M 240 100 L 280 100 L 280 135 L 240 135 Z" fill="#1e3d59" />
    <path d="M 240 170 L 280 170 L 280 135 L 240 135 Z" fill="#1e3d59" />
    <text x="260" y="90" font-family="Georgia, serif" font-size="12" fill="#1e3d59" text-anchor="middle">valve</text>

    <!-- Flow stops at valve -->
    <path d="M 60 135 L 120 135" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <path d="M 135 135 L 200 135" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <path d="M 215 135 L 235 135" stroke="#1e3d59" stroke-width="2.2" marker-end="url(#flow-arrow-blue)" />
    <text x="100" y="124" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">flow</text>
    <text x="360" y="138" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a5a5a">no flow</text>

    <!-- Acoustic sensor -->
    <rect x="165" y="72" width="26" height="26" fill="#1c1c1c" />
    <line x1="178" y1="72" x2="178" y2="48" stroke="#1c1c1c" stroke-width="2.5" />
    <circle cx="178" cy="48" r="5" fill="#1e3d59" />
    <text x="195" y="52" font-family="Georgia, serif" font-size="11" fill="#1e3d59">Acoustic Sensor</text>

    <!-- Water-hammer shock rings upstream -->
    <path d="M 235 115 A 26 26 0 0 0 235 155" fill="none" stroke="#c94a4a" stroke-width="2.4" stroke-dasharray="6,4" />
    <path d="M 210 105 A 40 40 0 0 0 210 165" fill="none" stroke="#c94a4a" stroke-width="2" stroke-dasharray="6,4" />
    <path d="M 185 98 A 52 52 0 0 0 185 172" fill="none" stroke="#c94a4a" stroke-width="1.6" stroke-dasharray="6,4" />
    <text x="120" y="200" font-family="Georgia, serif" font-size="12" fill="#c94a4a">water hammer</text>
  </g>

  <!-- SHARED P(t) graph -->
  <g transform="translate(50, 610)">
    <rect x="0" y="0" width="500" height="340" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="28" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Pressure vs Time</text>
    <text x="250" y="48" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" text-anchor="middle">Same shut-in instant</text>

    <!-- Axes -->
    <line x1="70" y1="280" x2="460" y2="280" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
    <line x1="70" y1="280" x2="70" y2="70" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
    <text x="38" y="175" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" transform="rotate(-90 38 175)" text-anchor="middle">Pressure <tspan font-style="italic">P</tspan></text>
    <text x="430" y="268" font-family="Georgia, serif" font-size="12" fill="#1c1c1c">Time <tspan font-style="italic">t</tspan></text>

    <!-- Shut-in marker -->
    <line x1="200" y1="70" x2="200" y2="280" stroke="#5a5a5a" stroke-width="1.4" stroke-dasharray="4,4" />
    <text x="200" y="62" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" text-anchor="middle">shut-in</text>

    <!-- Clamp trace: solid orange — spike then damps flat -->
    <path d="M 70 230
             L 200 230
             L 208 100
             L 222 215
             L 240 224
             L 270 228
             L 460 228"
          fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" />
    <circle cx="200" cy="230" r="4" fill="#c2410c" />

    <!-- Valve trace: solid teal — spike then ringing; settles lower so it never sits on the orange line -->
    <path d="M 70 255
             L 200 255
             L 206 85
             L 218 268
             L 230 105
             L 242 258
             L 254 125
             L 266 248
             L 278 145
             L 290 238
             L 310 175
             L 340 205
             L 380 195
             L 460 192"
          fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" />
    <circle cx="200" cy="255" r="4" fill="#0f766e" />

    <!-- Legend with behavior subtitles -->
    <line x1="285" y1="84" x2="320" y2="84" stroke="#c2410c" stroke-width="3" />
    <text x="328" y="88" font-family="Georgia, serif" font-size="12" fill="#c2410c">Clamp (elastic vessel)</text>
    <text x="328" y="104" font-family="Georgia, serif" font-size="10" fill="#8a5a3a">spike, then damps flat</text>
    <line x1="285" y1="124" x2="320" y2="124" stroke="#0f766e" stroke-width="3" />
    <text x="328" y="128" font-family="Georgia, serif" font-size="12" fill="#0f766e">Valve (steel pipe)</text>
    <text x="328" y="144" font-family="Georgia, serif" font-size="10" fill="#3d6b66">spike, then rings (knock)</text>
  </g>
</svg>
