<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="100%" height="100%">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#f2efe3" />
  
  <text x="300" y="40" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Fig. 2b — Acoustic Signatures</text>

  <!-- TOP: Vascular Bruit (Medical) -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="500" height="340" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#3a3a3a" text-anchor="middle">Vascular Bruit</text>
    
    <!-- Artery with stenosis -->
    <path d="M 50 120 C 200 120, 230 160, 250 160 C 270 160, 300 120, 450 120" fill="none" stroke="#5a5a5a" stroke-width="4" />
    <path d="M 50 200 C 200 200, 230 170, 250 170 C 270 170, 300 200, 450 200" fill="none" stroke="#5a5a5a" stroke-width="4" />
    
    <!-- Stethoscope bell -->
    <path d="M 230 100 L 270 100 L 260 80 L 240 80 Z" fill="#e8e2d8" stroke="#3a3a3a" stroke-width="2" />
    <path d="M 250 80 L 250 40 C 250 20, 270 10, 290 10 L 400 10" fill="none" stroke="#3a3a3a" stroke-width="2.5" />
    <text x="410" y="15" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Stethoscope</text>

    <!-- Turbulence Waves -->
    <path d="M 260 185 C 290 150, 330 200, 360 160 C 390 130, 420 180, 440 170" fill="none" stroke="#c94a4a" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Waveform Box -->
    <rect x="50" y="230" width="400" height="80" fill="#f2efe3" stroke="#3a3a3a" stroke-width="1.5" rx="3" />
    <!-- Low-frequency chaotic wave -->
    <path d="M 50 270 Q 75 240, 100 280 T 150 250 T 200 290 T 250 240 T 300 280 T 350 250 T 400 280 T 450 270" fill="none" stroke="#3a3a3a" stroke-width="2.5" />
    <text x="250" y="330" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#5a5a5a" text-anchor="middle">Continuous Low-Frequency Murmur</text>
  </g>

  <!-- BOTTOM: Well Knocking (Engineering) -->
  <g transform="translate(50, 450)">
    <rect x="0" y="0" width="500" height="340" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="250" y="30" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1e3d59" text-anchor="middle">Wellbore Knocking</text>
    
    <!-- Steel Pipe with valve/restriction -->
    <rect x="50" y="120" width="400" height="80" fill="none" stroke="#1c1c1c" stroke-width="2.5" />
    <path d="M 50 120 L 450 120 M 50 200 L 450 200" stroke="#1c1c1c" stroke-width="2.5" />
    
    <!-- Valve / Choke -->
    <path d="M 230 120 L 270 120 L 270 150 L 230 150 Z" fill="#1e3d59" />
    <path d="M 230 200 L 270 200 L 270 170 L 230 170 Z" fill="#1e3d59" />
    
    <!-- Acoustic Sensor / Geophone -->
    <rect x="180" y="90" width="30" height="30" fill="#1c1c1c" />
    <line x1="195" y1="90" x2="195" y2="40" stroke="#1c1c1c" stroke-width="3" />
    <circle cx="195" cy="40" r="6" fill="#1e3d59" />
    <text x="215" y="45" font-family="Georgia, serif" font-size="12" fill="#1e3d59">Acoustic Sensor</text>

    <!-- Reflected Shockwaves -->
    <path d="M 220 140 A 30 30 0 0 0 220 180" fill="none" stroke="#c94a4a" stroke-width="2.5" stroke-dasharray="6,4" />
    <path d="M 190 125 A 50 50 0 0 0 190 195" fill="none" stroke="#c94a4a" stroke-width="2" stroke-dasharray="6,4" />

    <!-- Waveform Box -->
    <rect x="50" y="230" width="400" height="80" fill="#f2efe3" stroke="#1c1c1c" stroke-width="1.5" rx="3" />
    <!-- Sharp transient spike (water hammer) -->
    <path d="M 50 270 L 150 270 L 160 210 L 170 300 L 180 230 L 190 290 L 200 240 L 210 280 L 220 250 L 230 270 L 450 270" fill="none" stroke="#1e3d59" stroke-width="2" />
    <text x="250" y="330" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59" text-anchor="middle">High-Amplitude Transient Spike</text>
  </g>

</svg>
