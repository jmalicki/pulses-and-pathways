<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="100%" height="100%">
  <defs>
    <!-- Soft graphite shading gradient for blood vessel wall -->
    <linearGradient id="wall-shade-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3ded5" />
      <stop offset="100%" stop-color="#f2efe3" />
    </linearGradient>
    <linearGradient id="wall-shade-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2efe3" />
      <stop offset="100%" stop-color="#e3ded5" />
    </linearGradient>
    <!-- Arrowheads -->
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c94a4a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4a90e2" />
    </marker>
  </defs>

  <!-- Cream background -->
  <rect width="100%" height="100%" fill="#f2efe3" />

  <!-- Grid lines -->
  <line x1="40" y1="40" x2="760" y2="40" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="570" x2="760" y2="570" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="400" y1="30" x2="400" y2="350" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <!-- SECTION 1: PROFILE A — HEALTHY VESSEL (TOP LEFT) -->
  <g transform="translate(0, 0)">
    <text x="50" y="70" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Profile A: Healthy Vessel (Laminar Flow)</text>
    
    <!-- Vessel Walls (graphite sketch style) -->
    <!-- Top wall -->
    <rect x="50" y="80" width="310" height="15" fill="url(#wall-shade-top)" opacity="0.7"/>
    <path d="M 50 95 C 100 94, 200 96, 360 95" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="0.5,1.5" />
    <path d="M 50 95 L 360 95" fill="none" stroke="#5a5a5a" stroke-width="1.2" />
    
    <!-- Bottom wall -->
    <rect x="50" y="155" width="310" height="15" fill="url(#wall-shade-bottom)" opacity="0.7"/>
    <path d="M 50 155 C 100 156, 200 154, 360 155" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="0.5,1.5" />
    <path d="M 50 155 L 360 155" fill="none" stroke="#5a5a5a" stroke-width="1.2" />

    <!-- Laminar Streamlines (Parabolic profile) -->
    <path d="M 60 105 L 340 105" stroke="#c94a4a" stroke-width="1.2" marker-end="url(#arrow-red)" opacity="0.6" />
    <path d="M 60 115 L 350 115" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arrow-red)" opacity="0.8" />
    <path d="M 60 125 L 355 125" stroke="#c94a4a" stroke-width="2.0" marker-end="url(#arrow-red)" />
    <path d="M 60 135 L 350 135" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arrow-red)" opacity="0.8" />
    <path d="M 60 145 L 340 145" stroke="#c94a4a" stroke-width="1.2" marker-end="url(#arrow-red)" opacity="0.6" />

    <!-- Radius Label r_1 -->
    <line x1="80" y1="125" x2="80" y2="95" stroke="#3a3a3a" stroke-width="0.8" />
    <circle cx="80" cy="125" r="1.5" fill="#3a3a3a" />
    <circle cx="80" cy="95" r="1.5" fill="#3a3a3a" />
    <text x="86" y="113" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#3a3a3a">r<tspan font-size="8" dy="3">1</tspan></text>
  </g>

  <!-- SECTION 2: PROFILE B — SEVERE STENOSIS (TOP RIGHT / MIDDLE) -->
  <g transform="translate(400, 0)">
    <text x="30" y="70" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Profile B: Severe Stenosis (Turbulence &amp; Jet)</text>

    <!-- Sketchy Vessel Walls with Narrowing (Embedded AI Sketch) -->
    <image href="stenosis_cutaway.jpg" x="20" y="80" width="330" height="90" preserveAspectRatio="xMidYMid slice" opacity="0.45" />
    <path d="M 30 80 L 350 80 L 350 170 L 30 170 Z" fill="none" stroke="#3a3a3a" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.4" />

    <!-- Flow lines showing high velocity jet and eddies -->
    <path d="M 40 110 L 110 110" stroke="#c94a4a" stroke-width="1.2" opacity="0.7"/>
    <path d="M 40 125 L 110 125" stroke="#c94a4a" stroke-width="1.5"/>
    <path d="M 40 140 L 110 140" stroke="#c94a4a" stroke-width="1.2" opacity="0.7"/>

    <!-- Converging streamlines -->
    <path d="M 110 110 C 130 110, 150 122, 175 122" stroke="#c94a4a" stroke-width="1.2" fill="none" />
    <path d="M 110 125 C 135 125, 155 125, 175 125" stroke="#c94a4a" stroke-width="2.2" fill="none" />
    <path d="M 110 140 C 130 140, 150 128, 175 128" stroke="#c94a4a" stroke-width="1.2" fill="none" />

    <!-- High velocity jet downstream -->
    <path d="M 175 122 L 230 122" stroke="#c94a4a" stroke-width="1.5" fill="none" />
    <path d="M 175 125 L 255 125" stroke="#c94a4a" stroke-width="2.5" fill="none" marker-end="url(#arrow-red)" />
    <path d="M 175 128 L 230 128" stroke="#c94a4a" stroke-width="1.5" fill="none" />

    <!-- Turbulent eddies/vortices downstream -->
    <path d="M 230 115 C 240 102, 260 100, 270 105 C 275 110, 265 118, 250 115 C 245 112, 248 108, 255 108" fill="none" stroke="#5a5a5a" stroke-width="1.0" opacity="0.8" />
    <path d="M 230 135 C 240 148, 260 150, 270 145 C 275 140, 265 132, 250 135 C 245 138, 248 142, 255 142" fill="none" stroke="#5a5a5a" stroke-width="1.0" opacity="0.8" />

    <!-- Fully turbulent disorganized lines at the end -->
    <path d="M 290 115 C 310 120, 320 105, 340 110" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="2,1" fill="none" />
    <path d="M 290 125 C 310 130, 325 120, 340 128" stroke="#c94a4a" stroke-width="1.2" fill="none" marker-end="url(#arrow-red)" opacity="0.7" />
    <path d="M 290 135 C 305 130, 315 142, 340 138" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="2,1" fill="none" />

    <!-- Dimensions: d (throat diameter) and v (velocity) -->
    <line x1="180" y1="120" x2="180" y2="130" stroke="#3a3a3a" stroke-width="0.8" />
    <circle cx="180" cy="120" r="1.5" fill="#3a3a3a" />
    <circle cx="180" cy="130" r="1.5" fill="#3a3a3a" />
    <text x="186" y="129" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#3a3a3a">d</text>

    <!-- Radius Label r_2 at inlet -->
    <line x1="45" y1="125" x2="45" y2="95" stroke="#3a3a3a" stroke-width="0.8" />
    <circle cx="45" cy="125" r="1.5" fill="#3a3a3a" />
    <circle cx="45" cy="95" r="1.5" fill="#3a3a3a" />
    <text x="50" y="113" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#3a3a3a">r<tspan font-size="8" dy="3">2</tspan></text>

    <!-- Velocity label v at jet -->
    <text x="210" y="145" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#c94a4a">v</text>
  </g>

  <!-- SECTION 3: GRAPH (BOTTOM) -->
  <g transform="translate(0, 200)">
    <text x="50" y="40" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Velocity &amp; Pressure Profiles along Axial Distance x</text>

    <!-- Graph area -->
    <!-- Axes -->
    <!-- X-axis: Axial Distance x -->
    <line x1="100" y1="260" x2="720" y2="260" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
    <!-- Y1-axis (Left): Velocity v -->
    <line x1="100" y1="90" x2="100" y2="260" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arrow-red)" />
    <!-- Y2-axis (Right): Pressure P -->
    <line x1="700" y1="90" x2="700" y2="260" stroke="#4a90e2" stroke-width="1.5" marker-end="url(#arrow-blue)" />

    <!-- Explicit Labels for Axes with Full Name + LaTeX style variable -->
    <!-- Left Y-Axis (Velocity v) rotated -90, placed to the left -->
    <text x="65" y="175" font-family="Georgia, serif" font-size="12" fill="#c94a4a" transform="rotate(-90 65 175)" text-anchor="middle">Velocity <tspan font-style="italic">v</tspan></text>
    
    <!-- Right Y-Axis (Pressure P) rotated 90, placed to the right -->
    <text x="735" y="175" font-family="Georgia, serif" font-size="12" fill="#4a90e2" transform="rotate(90 735 175)" text-anchor="middle">Pressure <tspan font-style="italic">P</tspan></text>
    
    <!-- X-Axis (Axial Distance x) placed above the axis line -->
    <text x="580" y="250" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" text-anchor="middle">Axial Distance <tspan font-style="italic">x</tspan></text>

    <!-- Vertical dashed grid lines representing the narrowing zones -->
    <line x1="330" y1="90" x2="330" y2="260" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="400" y1="90" x2="400" y2="260" stroke="#d5ceb9" stroke-width="1.2" stroke-dasharray="2,2" />
    <line x1="470" y1="90" x2="470" y2="260" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="4,4" />
    <text x="388" y="275" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">Throat</text>

    <!-- VELOCITY CURVE (Solid Red) -->
    <path d="M 100 230 
             L 300 230 
             C 340 230, 380 120, 400 120 
             C 420 120, 460 210, 500 210
             C 530 210, 560 225, 700 225" 
          fill="none" stroke="#c94a4a" stroke-width="3" />
    
    <!-- PRESSURE CURVE (Dashed Blue) -->
    <path d="M 100 120 
             L 300 120 
             C 340 120, 380 235, 400 235 
             C 420 235, 460 170, 500 170
             C 530 170, 560 160, 700 160" 
          fill="none" stroke="#4a90e2" stroke-width="2.5" stroke-dasharray="6,4" />

    <!-- Permanent Pressure Drop Label Delta P -->
    <line x1="650" y1="120" x2="650" y2="160" stroke="#1c1c1c" stroke-width="0.8" marker-start="url(#arrow-charcoal)" marker-end="url(#arrow-charcoal)" />
    <text x="660" y="145" font-family="Georgia, serif" font-size="13" fill="#1c1c1c">Δ<tspan font-style="italic">P</tspan></text>

    <!-- Equations Panel -->
    <g transform="translate(100, 290)">
      <rect x="0" y="0" width="600" height="60" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="3" />
      <text x="20" y="22" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#1c1c1c">
        Reynolds Number (<tspan font-style="italic">Re</tspan>) = Density (<tspan font-style="italic">ρ</tspan>) × Velocity (<tspan font-style="italic">v</tspan>) × Diameter (<tspan font-style="italic">d</tspan>) / Viscosity (<tspan font-style="italic">μ</tspan>)
      </text>
      <text x="20" y="45" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#1c1c1c">
        Pressure Drop (Δ<tspan font-style="italic">P</tspan>) ≈ 4 × Velocity (<tspan font-style="italic">v</tspan>)<tspan font-size="10" dy="-5">2</tspan>
      </text>
      <text x="230" y="44" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">
        (clinical estimation)
      </text>
    </g>
  </g>

  <!-- Title / Figure label -->
  <text x="50" y="35" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">Fig. 4 — Fluid Dynamics of a Vessel Narrowing</text>
</svg>
