<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="100%" height="100%">
  <defs>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c94a4a" />
    </marker>
    <linearGradient id="wall-shade-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e3ded5" />
      <stop offset="100%" stop-color="#f2efe3" />
    </linearGradient>
    <linearGradient id="wall-shade-bottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2efe3" />
      <stop offset="100%" stop-color="#e3ded5" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3" />
  <line x1="30" y1="36" x2="490" y2="36" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="30" y1="300" x2="490" y2="300" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="30" y1="560" x2="490" y2="560" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <text x="40" y="28" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c">Unused — Poiseuille's Law</text>

  <!-- Vessel with labeled radius -->
  <g transform="translate(0, 0)">
    <text x="40" y="60" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">Vessel lumen radius</text>
    <text x="40" y="78" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">The distance from the centerline to the inner wall</text>

    <!-- vessel walls -->
    <rect x="70" y="100" width="380" height="18" fill="url(#wall-shade-top)" opacity="0.8"/>
    <path d="M 70 118 L 450 118" fill="none" stroke="#5a5a5a" stroke-width="1.4" />
    <rect x="70" y="210" width="380" height="18" fill="url(#wall-shade-bottom)" opacity="0.8"/>
    <path d="M 70 210 L 450 210" fill="none" stroke="#5a5a5a" stroke-width="1.4" />

    <!-- laminar streamlines -->
    <path d="M 90 140 L 420 140" stroke="#c94a4a" stroke-width="1.1" opacity="0.55" marker-end="url(#arrow-red)" />
    <path d="M 90 155 L 430 155" stroke="#c94a4a" stroke-width="1.5" opacity="0.75" marker-end="url(#arrow-red)" />
    <path d="M 90 164 L 440 164" stroke="#c94a4a" stroke-width="2.2" marker-end="url(#arrow-red)" />
    <path d="M 90 173 L 430 173" stroke="#c94a4a" stroke-width="1.5" opacity="0.75" marker-end="url(#arrow-red)" />
    <path d="M 90 188 L 420 188" stroke="#c94a4a" stroke-width="1.1" opacity="0.55" marker-end="url(#arrow-red)" />

    <!-- centerline -->
    <line x1="70" y1="164" x2="450" y2="164" stroke="#5a5a5a" stroke-width="0.8" stroke-dasharray="6,4" />

    <!-- radius bracket -->
    <line x1="160" y1="164" x2="160" y2="118" stroke="#1e3d59" stroke-width="1.3" />
    <circle cx="160" cy="164" r="2.2" fill="#1e3d59" />
    <circle cx="160" cy="118" r="2.2" fill="#1e3d59" />
    <text x="172" y="145" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#1e3d59">r</text>
    <text x="190" y="145" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">lumen radius</text>

    <text x="260" y="255" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" text-anchor="middle">flow direction &#x2192;</text>
    <text x="260" y="275" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1c1c1c" text-anchor="middle">Q  = volumetric flow rate through the vessel</text>
  </g>

  <!-- Definitions + derivation -->
  <g transform="translate(30, 315)">
    <text x="10" y="20" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">Definitions</text>
    <text x="10" y="48" font-family="Georgia, serif" font-size="13" fill="#1c1c1c">
      <tspan font-style="italic">Q</tspan> &#x2014; volumetric flow rate (how much fluid passes per time)
    </text>
    <text x="10" y="72" font-family="Georgia, serif" font-size="13" fill="#1c1c1c">
      <tspan font-style="italic">R</tspan> &#x2014; hydraulic resistance (how hard it is to drive that flow)
    </text>
    <text x="10" y="96" font-family="Georgia, serif" font-size="13" fill="#1c1c1c">
      <tspan font-style="italic">r</tspan> &#x2014; lumen radius (centerline to inner wall)
    </text>

    <text x="10" y="140" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">Why the fourth power</text>
    <text x="10" y="168" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#1c1c1c">
      <tspan font-style="italic">Q</tspan> &#x221D; <tspan font-style="italic">r</tspan><tspan font-size="11" dy="-6">4</tspan><tspan dy="6"> &#x00A0;&#x21D2;&#x00A0; </tspan><tspan font-style="italic">R</tspan> &#x221D; 1/<tspan font-style="italic">r</tspan><tspan font-size="11" dy="-6">4</tspan>
    </text>
    <text x="10" y="198" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">1. Area scales with <tspan font-style="italic">r</tspan><tspan font-size="9" dy="-5">2</tspan><tspan dy="5"> (&#x03C0;</tspan><tspan font-style="italic">r</tspan><tspan font-size="9" dy="-5">2</tspan><tspan dy="5">)</tspan></text>
    <text x="10" y="220" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">2. Mean velocity also scales with <tspan font-style="italic">r</tspan><tspan font-size="9" dy="-5">2</tspan><tspan dy="5"> (wall friction / parabolic profile)</tspan></text>
    <text x="10" y="242" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">3. Flow = area &#x00D7; velocity &#x221D; <tspan font-style="italic">r</tspan><tspan font-size="9" dy="-5">2</tspan><tspan dy="5"> &#x00D7; </tspan><tspan font-style="italic">r</tspan><tspan font-size="9" dy="-5">2</tspan><tspan dy="5"> = </tspan><tspan font-style="italic">r</tspan><tspan font-size="9" dy="-5">4</tspan></text>
  </g>
</svg>
