<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3" />
  <text x="260" y="28" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Fig. 13 &#8212; Duplex Screen (Second Check)</text>

  <!-- Monitor bezel -->
  <rect x="40" y="48" width="440" height="340" rx="10" fill="#2a2a2a" />
  <rect x="56" y="64" width="408" height="280" fill="#1a1a1a" />
  <circle cx="260" cy="368" r="6" fill="#5a5a5a" />

  <!-- Screen content -->
  <rect x="72" y="80" width="376" height="248" fill="#0d1a14" />

  <!-- Grid -->
  <g stroke="#1e3d3a" stroke-width="0.8">
    <line x1="72" y1="130" x2="448" y2="130" />
    <line x1="72" y1="180" x2="448" y2="180" />
    <line x1="72" y1="230" x2="448" y2="230" />
    <line x1="72" y1="280" x2="448" y2="280" />
    <line x1="160" y1="80" x2="160" y2="328" />
    <line x1="248" y1="80" x2="248" y2="328" />
    <line x1="336" y1="80" x2="336" y2="328" />
  </g>

  <!-- Baseline -->
  <line x1="88" y1="230" x2="432" y2="230" stroke="#8a9a8a" stroke-width="1.2" stroke-dasharray="4,3" />
  <text x="92" y="226" font-family="Georgia, serif" font-size="10" fill="#8a9a8a">0</text>

  <text x="260" y="318" font-family="Georgia, serif" font-size="11" fill="#a8b8a8" text-anchor="middle">time</text>
  <text x="82" y="200" font-family="Georgia, serif" font-size="11" fill="#a8b8a8" transform="rotate(-90 82 200)" text-anchor="middle">velocity</text>

  <!-- Triphasic: systolic forward, early diastolic reverse, late diastolic forward -->
  <!-- Cycle 1 -->
  <path d="M 100 230
           L 108 220
           L 118 130
           L 128 145
           L 136 210
           L 142 248
           L 150 255
           L 158 238
           L 168 218
           L 180 222
           L 190 230"
        fill="none" stroke="#6aab7a" stroke-width="2.4" />
  <!-- labels on first cycle -->
  <text x="118" y="118" font-family="Georgia, serif" font-size="10" fill="#6aab7a" text-anchor="middle">1</text>
  <text x="150" y="272" font-family="Georgia, serif" font-size="10" fill="#6aab7a" text-anchor="middle">2</text>
  <text x="172" y="210" font-family="Georgia, serif" font-size="10" fill="#6aab7a" text-anchor="middle">3</text>

  <!-- Cycle 2 -->
  <path d="M 190 230
           L 198 220
           L 208 128
           L 218 142
           L 226 208
           L 232 246
           L 240 254
           L 248 236
           L 258 216
           L 270 220
           L 282 230"
        fill="none" stroke="#6aab7a" stroke-width="2.4" />

  <!-- Cycle 3 -->
  <path d="M 282 230
           L 290 218
           L 300 132
           L 310 146
           L 318 210
           L 324 248
           L 332 255
           L 340 238
           L 350 218
           L 362 222
           L 374 230"
        fill="none" stroke="#6aab7a" stroke-width="2.4" />

  <!-- Cycle 4 partial -->
  <path d="M 374 230
           L 382 220
           L 392 130
           L 402 144
           L 412 208
           L 420 244
           L 428 250"
        fill="none" stroke="#6aab7a" stroke-width="2.4" />

  <text x="260" y="100" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#6aab7a" text-anchor="middle">triphasic &#8212; open distal bed</text>
  <text x="260" y="300" font-family="Georgia, serif" font-size="10" fill="#8a9a8a" text-anchor="middle">1 systolic forward &#183; 2 early reverse &#183; 3 late forward</text>
</svg>
