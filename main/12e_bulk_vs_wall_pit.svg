<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c94a4a"/>
    </marker>
    <pattern id="v2" patternUnits="userSpaceOnUse" width="7" height="7">
      <path d="M0,7 L7,0" stroke="#c4b8a0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3"/>
  <text x="28" y="32" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c">Fig. 7e &#8212; Mid-stream vs wall</text>
  <text x="28" y="52" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Same late punch &#8212; churns fluid mid-stream; pits metal at a wall</text>

  <!-- Mid-stream -->
  <g transform="translate(40, 80)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Mid-stream</text>
    <rect x="0" y="20" width="280" height="200" fill="#e8e2d8" stroke="#3a3a3a" stroke-width="1"/>
    <circle cx="140" cy="120" r="36" fill="url(#v2)" stroke="#3a3a3a" stroke-width="1.5"/>
    <line x1="60" y1="120" x2="98" y2="120" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#a1)"/>
    <line x1="220" y1="120" x2="182" y2="120" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#a1)"/>
    <line x1="140" y1="50" x2="140" y2="80" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#a1)"/>
    <line x1="140" y1="190" x2="140" y2="160" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#a1)"/>
    <text x="140" y="250" font-family="Georgia, serif" font-size="12" fill="#5a5a5a" text-anchor="middle">mostly churns liquid</text>
  </g>

  <!-- Against wall -->
  <g transform="translate(380, 80)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Against a wall</text>
    <rect x="0" y="20" width="280" height="200" fill="#e8e2d8" stroke="#3a3a3a" stroke-width="1"/>
    <rect x="0" y="20" width="22" height="200" fill="#d8d2c8" stroke="#3a3a3a" stroke-width="1.4"/>
    <text x="4" y="230" font-family="Georgia, serif" font-size="10" fill="#3a3a3a">metal</text>
    <circle cx="100" cy="120" r="32" fill="url(#v2)" stroke="#c94a4a" stroke-width="1.6"/>
    <line x1="200" y1="120" x2="138" y2="120" stroke="#c94a4a" stroke-width="1.8" marker-end="url(#a2)"/>
    <line x1="100" y1="55" x2="100" y2="84" stroke="#c94a4a" stroke-width="1.6" marker-end="url(#a2)"/>
    <line x1="100" y1="185" x2="100" y2="156" stroke="#c94a4a" stroke-width="1.6" marker-end="url(#a2)"/>
    <path d="M 85 105 L 22 120 L 85 135" fill="none" stroke="#c94a4a" stroke-width="1.8"/>
    <text x="140" y="250" font-family="Georgia, serif" font-size="12" fill="#c94a4a" text-anchor="middle">liquid jet / shock into steel</text>
  </g>

  <!-- Pit aftermath -->
  <g transform="translate(40, 340)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Aftermath &#8212; pit</text>
    <rect x="0" y="16" width="320" height="36" fill="#d8d2c8" stroke="#3a3a3a" stroke-width="1.4"/>
    <path d="M 140 16 L 155 52 L 170 16" fill="#f2efe3" stroke="#c94a4a" stroke-width="1.6"/>
    <text x="340" y="40" font-family="Georgia, serif" font-size="12" fill="#3a3a3a">Repeated late hits pit through</text>
    <text x="340" y="58" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">(impeller, pipe, choke bean &#8212; or leaflet / red cell)</text>
  </g>
</svg>
