<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <!-- Arrowheads for flow and axes -->
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c94a4a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4a90e2" />
    </marker>
  </defs>

  <!-- Cream background -->
  <rect width="100%" height="100%" fill="#faf8f5" />

  <!-- Grid lines -->
  <line x1="40" y1="40" x2="760" y2="40" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="510" x2="760" y2="510" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="400" y1="30" x2="400" y2="460" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <!-- SECTION 1: BRANCHING TREE SKETCH (LEFT) -->
  <g transform="translate(0, 0)">
    <text x="50" y="70" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Vascular Branching Tree</text>

    <!-- Main Inlet (Aorta equivalent) -->
    <path d="M 50 240 C 70 240, 90 238, 110 230 C 120 220, 125 210, 130 195" fill="none" stroke="#3a3a3a" stroke-width="2.5" />
    <path d="M 50 260 C 70 260, 90 262, 110 270 C 120 280, 125 290, 130 305" fill="none" stroke="#3a3a3a" stroke-width="2.5" />
    <path d="M 55 243 C 70 243, 85 242, 100 238" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.6" stroke-dasharray="3,1" />
    <path d="M 55 257 C 70 257, 85 258, 100 262" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.6" stroke-dasharray="3,1" />

    <!-- Branch 1 (Upper Branch) -->
    <path d="M 130 195 C 135 180, 150 150, 190 145 C 200 143, 210 143, 220 140" fill="none" stroke="#3a3a3a" stroke-width="1.8" />
    <path d="M 145 205 C 150 190, 162 165, 192 160 C 202 158, 212 158, 222 155" fill="none" stroke="#3a3a3a" stroke-width="1.8" />
    
    <!-- Branch 2 (Middle Branch) -->
    <line x1="120" y1="245" x2="220" y2="245" fill="none" stroke="#3a3a3a" stroke-width="1.5" />
    <line x1="120" y1="255" x2="220" y2="255" fill="none" stroke="#3a3a3a" stroke-width="1.5" />
    
    <!-- Branch 3 (Lower Branch) -->
    <path d="M 130 305 C 135 320, 150 350, 190 355 C 200 357, 210 357, 220 360" fill="none" stroke="#3a3a3a" stroke-width="1.8" />
    <path d="M 145 295 C 150 310, 162 335, 192 340 C 202 342, 212 342, 222 345" fill="none" stroke="#3a3a3a" stroke-width="1.8" />

    <!-- Pencil cross-hatching at branch splits -->
    <path d="M 118 226 L 126 238 M 122 222 L 130 234" stroke="#5a5a5a" stroke-width="0.8" opacity="0.6" />
    <path d="M 118 274 L 126 262 M 122 278 L 130 266" stroke="#5a5a5a" stroke-width="0.8" opacity="0.6" />

    <!-- Arterioles (Sub-branching) -->
    <path d="M 221 147 C 235 142, 245 130, 260 125" fill="none" stroke="#3a3a3a" stroke-width="1.2" />
    <path d="M 221 147 C 235 147, 245 152, 260 155" fill="none" stroke="#3a3a3a" stroke-width="1.2" />
    <path d="M 220 250 C 235 245, 245 235, 260 230" fill="none" stroke="#3a3a3a" stroke-width="1.0" />
    <path d="M 220 250 C 235 255, 245 265, 260 270" fill="none" stroke="#3a3a3a" stroke-width="1.0" />
    <path d="M 221 352 C 235 347, 245 335, 260 330" fill="none" stroke="#3a3a3a" stroke-width="1.2" />
    <path d="M 221 352 C 235 357, 245 365, 260 370" fill="none" stroke="#3a3a3a" stroke-width="1.2" />

    <!-- Capillary Network Mesh -->
    <path d="M 260 125 C 275 120, 285 115, 300 115 C 315 115, 325 120, 340 125" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.4" />
    <path d="M 260 155 C 275 160, 285 170, 300 170 C 315 170, 325 160, 340 155" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.4" />
    <path d="M 260 230 C 275 225, 285 220, 300 220 C 315 220, 325 225, 340 230" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.4" />
    <path d="M 260 270 C 275 275, 285 280, 300 280 C 315 280, 325 275, 340 270" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.4" />
    <path d="M 260 330 C 275 325, 285 320, 300 320 C 315 320, 325 325, 340 330" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.4" />
    <path d="M 260 370 C 275 375, 285 385, 300 385 C 315 385, 325 375, 340 370" fill="none" stroke="#5a5a5a" stroke-width="0.8" opacity="0.4" />

    <!-- Cross-mesh capillary connections -->
    <path d="M 280 115 L 280 380 M 295 120 L 295 380 M 310 115 L 310 380 M 325 120 L 325 380" fill="none" stroke="#5a5a5a" stroke-width="0.6" opacity="0.3" stroke-dasharray="1,2" />

    <!-- Flow and Resistance Labels -->
    <path d="M 30 250 L 50 250" stroke="#c94a4a" stroke-width="2.0" marker-end="url(#arrow-red)" />
    <text x="15" y="245" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#c94a4a">Q<tspan font-size="10" dy="4">in</tspan></text>

    <!-- Branch 1 (q1, R1) -->
    <text x="170" y="130" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#3a3a3a">R<tspan font-size="9" font-style="normal" dy="3">1</tspan></text>
    <path d="M 170 152 L 185 150" stroke="#c94a4a" stroke-width="1.2" marker-end="url(#arrow-red)" />
    <text x="190" y="148" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#c94a4a">q<tspan font-size="8" font-style="normal" dy="3">1</tspan></text>

    <!-- Branch 2 (q2, R2) -->
    <text x="160" y="235" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#3a3a3a">R<tspan font-size="9" font-style="normal" dy="3">2</tspan></text>
    <path d="M 160 250 L 175 250" stroke="#c94a4a" stroke-width="1.2" marker-end="url(#arrow-red)" />
    <text x="180" y="247" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#c94a4a">q<tspan font-size="8" font-style="normal" dy="3">2</tspan></text>

    <!-- Branch 3 (q3, R3) -->
    <text x="170" y="380" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#3a3a3a">R<tspan font-size="9" font-style="normal" dy="3">3</tspan></text>
    <path d="M 170 348 L 185 350" stroke="#c94a4a" stroke-width="1.2" marker-end="url(#arrow-red)" />
    <text x="190" y="362" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#c94a4a">q<tspan font-size="8" font-style="normal" dy="3">3</tspan></text>
  </g>

  <!-- SECTION 2: AREA AND VELOCITY GRAPH (RIGHT) -->
  <g transform="translate(420, 0)">
    <text x="30" y="70" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Hemodynamics Across Segment Types</text>

    <!-- Axes -->
    <line x1="40" y1="360" x2="330" y2="360" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
    <line x1="40" y1="100" x2="40" y2="360" stroke="#1c1c1c" stroke-width="1.5" />

    <!-- Explicit Labels for Axes with Full Name + LaTeX style variable -->
    <!-- Left Y-Axis rotated -90, placed to the left of the axis line -->
    <text x="15" y="230" font-family="Georgia, serif" font-size="11" fill="#1c1c1c" transform="rotate(-90 15 230)" text-anchor="middle">Relative Area <tspan font-style="italic">A</tspan><tspan font-size="8" dy="3">total</tspan><tspan font-size="11" dy="-3"> &amp; Mean Velocity </tspan><tspan font-style="italic">v</tspan></text>

    <!-- X-Axis placed above the axis line at x=280 -->
    <text x="280" y="350" font-family="Georgia, serif" font-size="11" fill="#1c1c1c" text-anchor="middle">Vessel Segment</text>

    <!-- Legends inside the plot area for clarity -->
    <text x="45" y="115" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#4a90e2">Total Area <tspan font-style="italic">A</tspan><tspan font-size="8" dy="3">total</tspan></text>
    <text x="45" y="132" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#c94a4a">Mean Velocity <tspan font-style="italic">v</tspan></text>

    <!-- Segment labels on X-axis -->
    <line x1="70" y1="360" x2="70" y2="365" stroke="#1c1c1c" stroke-width="1.2" />
    <line x1="120" y1="360" x2="120" y2="365" stroke="#1c1c1c" stroke-width="1.2" />
    <line x1="170" y1="360" x2="170" y2="365" stroke="#1c1c1c" stroke-width="1.2" />
    <line x1="220" y1="360" x2="220" y2="365" stroke="#1c1c1c" stroke-width="1.2" />
    <line x1="270" y1="360" x2="270" y2="365" stroke="#1c1c1c" stroke-width="1.2" />
    <line x1="310" y1="360" x2="310" y2="365" stroke="#1c1c1c" stroke-width="1.2" />

    <g font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">
      <text x="70" y="380">Aorta</text>
      <text x="120" y="380">Arteries</text>
      <text x="170" y="380">Arteriol.</text>
      <text x="220" y="380">Capill.</text>
      <text x="270" y="380">Venules</text>
      <text x="310" y="380">Veins</text>
    </g>

    <!-- Area Curve A_total (Dashed Blue) -->
    <path d="M 70 345 
             C 100 345, 120 330, 170 280 
             C 195 240, 210 140, 220 140
             C 230 140, 245 240, 270 310
             C 290 340, 300 342, 310 342" 
          fill="none" stroke="#4a90e2" stroke-width="2.5" stroke-dasharray="6,4" />

    <!-- Velocity Curve v (Solid Red) -->
    <path d="M 70 160 
             C 100 170, 120 190, 170 290 
             C 195 330, 210 348, 220 348
             C 230 348, 245 320, 270 280
             C 290 260, 300 240, 310 240" 
          fill="none" stroke="#c94a4a" stroke-width="3" />

    <!-- Shading under Velocity curve in capillaries -->
    <path d="M 200 320 L 200 360 M 210 340 L 210 360 M 220 348 L 220 360 M 230 340 L 230 360 M 240 320 L 240 360" stroke="#fbc5c5" stroke-width="1.5" opacity="0.6" />
    <text x="220" y="335" font-family="Georgia, serif" font-size="9" fill="#c94a4a" text-anchor="middle">Min Vel.</text>
  </g>

  <!-- SECTION 3: EQUATIONS PANEL (BOTTOM CENTER) -->
  <g transform="translate(180, 440)">
    <rect x="0" y="0" width="440" height="55" fill="#faf8f5" stroke="#e8e2d8" stroke-width="1" rx="3" />
    <text x="30" y="34" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#1c1c1c">
      <tspan font-style="italic">Q</tspan> = <tspan font-style="italic">A · v</tspan>
    </text>
    <line x1="200" y1="10" x2="200" y2="45" stroke="#e8e2d8" stroke-width="1" />
    <text x="230" y="34" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#1c1c1c">
      1 / <tspan font-style="italic">R<tspan font-size="11" dy="4">total</tspan></tspan><tspan dy="-4"> = </tspan><tspan font-size="20">∑</tspan> (1 / <tspan font-style="italic">R<tspan font-size="11" dy="4">i</tspan></tspan><tspan dy="-4">)</tspan>
    </text>
  </g>

  <!-- Title / Figure label -->
  <text x="50" y="35" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">Fig. 3 — Branching Networks &amp; Parallel Resistances</text>
</svg>
