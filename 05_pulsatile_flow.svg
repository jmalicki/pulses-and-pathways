<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3d59" />
    </marker>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
  </defs>

  <!-- Cream background -->
  <rect width="100%" height="100%" fill="#f2efe3" />

  <!-- Grid lines -->
  <line x1="40" y1="40" x2="760" y2="40" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="520" x2="760" y2="520" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <!-- SECTION 1: WINDKESSEL R-C CIRCUIT MODEL (TOP) -->
  <g transform="translate(0, 0)">
    <text x="50" y="65" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Windkessel R-C Circuit Model</text>

    <!-- Circuit Drawing -->
    <g transform="translate(180, 20)">
      <path d="M 0 60 L 40 60" stroke="#1e3d59" stroke-width="2" marker-end="url(#arrow-blue)" />
      <text x="-50" y="65" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#1e3d59">Q(t)</text>
      <text x="-50" y="80" font-family="Georgia, serif" font-size="10" fill="#1e3d59">(Inflow)</text>

      <line x1="40" y1="60" x2="120" y2="60" stroke="#1e3d59" stroke-width="2" />
      <circle cx="120" cy="60" r="3" fill="#1e3d59" />
      <text x="115" y="48" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">P(t)</text>

      <!-- Parallel Split to Capacitor C -->
      <line x1="120" y1="60" x2="120" y2="90" stroke="#1e3d59" stroke-width="2" />
      <line x1="100" y1="90" x2="140" y2="90" stroke="#1e3d59" stroke-width="3" />
      <line x1="100" y1="98" x2="140" y2="98" stroke="#1e3d59" stroke-width="3" />
      <line x1="120" y1="98" x2="120" y2="130" stroke="#1e3d59" stroke-width="2" />

      <!-- Parallel Split to Resistor R -->
      <line x1="120" y1="60" x2="170" y2="60" stroke="#1e3d59" stroke-width="2" />
      <path d="M 170 60 
               L 175 50 
               L 185 70 
               L 195 50 
               L 205 70 
               L 215 50 
               L 225 70 
               L 235 50 
               L 240 60" 
            fill="none" stroke="#1e3d59" stroke-width="2" stroke-linejoin="round" />
      <line x1="240" y1="60" x2="290" y2="60" stroke="#1e3d59" stroke-width="2" />
      <line x1="290" y1="60" x2="290" y2="130" stroke="#1e3d59" stroke-width="2" />

      <!-- Ground line -->
      <line x1="120" y1="130" x2="290" y2="130" stroke="#1e3d59" stroke-width="2" />
      <line x1="205" y1="130" x2="205" y2="145" stroke="#1e3d59" stroke-width="2" />
      
      <!-- Ground symbol -->
      <line x1="190" y1="145" x2="220" y2="145" stroke="#1e3d59" stroke-width="2" />
      <line x1="195" y1="150" x2="215" y2="150" stroke="#1e3d59" stroke-width="1.5" />
      <line x1="200" y1="155" x2="210" y2="155" stroke="#1e3d59" stroke-width="1" />

      <!-- Labels C and R -->
      <text x="150" y="98" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#1e3d59">C</text>
      <text x="150" y="113" font-family="Georgia, serif" font-size="9" fill="#5a5a5a">(Compliance)</text>
      <text x="195" y="38" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#1e3d59">R</text>
      <text x="180" y="23" font-family="Georgia, serif" font-size="9" fill="#5a5a5a">(Resistance)</text>
    </g>

    <!-- Description Block -->
    <rect x="420" y="60" width="300" height="80" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="4" />
    <text x="430" y="80" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1c1c1c">Description:</text>
    <text x="430" y="100" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">The Windkessel model demonstrates how arterial</text>
    <text x="430" y="115" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">compliance (C) dampens pulsatile flow. A stiff,</text>
    <text x="430" y="130" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">calcified vessel causes massive pressure spikes.</text>
  </g>

  <!-- SECTION 2: PRESSURE WAVE PLOT (BOTTOM) -->
  <g transform="translate(0, 200)">
    <text x="50" y="45" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Arterial Pressure Waveform Over Time</text>

    <!-- Axes -->
    <line x1="80" y1="230" x2="740" y2="230" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
    <line x1="80" y1="50" x2="80" y2="230" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
    
    <!-- Explicit Labels for Axes with Full Name + LaTeX style variable -->
    <!-- Left Y-Axis (Pressure P(t)) rotated -90, to the left of the axis line -->
    <text x="45" y="140" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" transform="rotate(-90 45 140)" text-anchor="middle">Pressure <tspan font-style="italic">P(t)</tspan></text>
    
    <!-- X-Axis (Time t) above the axis line -->
    <text x="660" y="220" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" text-anchor="middle">Time <tspan font-style="italic">t</tspan></text>
    
    <!-- Y-axis scale ticks (clinical mmHg) -->
    <line x1="75" y1="190" x2="80" y2="190" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="58" y="194" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">60</text>
    
    <line x1="75" y1="160" x2="80" y2="160" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="58" y="164" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">80</text>

    <line x1="75" y1="110" x2="80" y2="110" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="52" y="114" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">120</text>

    <line x1="75" y1="60" x2="80" y2="60" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="52" y="64" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">170</text>

    <!-- Curve A: Healthy/High Compliance -->
    <path d="M 100 160 
             C 115 160, 135 110, 150 110 
             C 165 110, 185 145, 195 145 
             C 198 145, 202 141, 205 140 
             C 210 139, 218 143, 225 147
             C 245 156, 265 160, 280 160
             C 295 160, 315 110, 330 110
             C 345 110, 365 145, 375 145
             C 378 145, 382 141, 385 140
             C 390 139, 398 143, 405 147
             C 425 156, 445 160, 460 160
             C 475 160, 495 110, 510 110
             C 525 110, 545 145, 555 145
             C 558 145, 562 141, 565 140
             C 570 139, 578 143, 585 147
             C 605 156, 625 160, 640 160" 
          fill="none" stroke="#3a3a3a" stroke-width="3" />

    <!-- Legend -->
    <rect x="520" y="60" width="210" height="40" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="4" />
    <line x1="530" y1="72" x2="560" y2="72" stroke="#3a3a3a" stroke-width="3" />
    <text x="565" y="75" font-family="Georgia, serif" font-size="10" fill="#3a3a3a">Curve A: Healthy (High Compliance)</text>
    
    <line x1="530" y1="88" x2="560" y2="88" stroke="#1e3d59" stroke-width="2.2" stroke-dasharray="6,3" />
    <text x="565" y="91" font-family="Georgia, serif" font-size="10" fill="#1e3d59">Curve B: Calcified (Low Compliance)</text>
    
    <!-- Dicrotic notch pointer -->
    <path d="M 210 140 L 225 133" stroke="#3a3a3a" stroke-width="0.8" />
    <text x="228" y="132" font-family="Georgia, serif" font-size="9" font-style="italic" fill="#3a3a3a">dicrotic notch</text>
    
    <!-- Curve B: Calcified Artery -->
    <path d="M 100 190 
             L 130 60
             L 165 175
             C 195 188, 245 190, 280 190
             L 310 60
             L 345 175
             C 375 188, 425 190, 460 190
             L 490 60
             L 525 175
             C 555 188, 605 190, 640 190" 
          fill="none" stroke="#1e3d59" stroke-width="2.2" stroke-dasharray="6,3" />

    <line x1="80" y1="160" x2="640" y2="160" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="110" x2="640" y2="110" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
  </g>

  <!-- SECTION 3: EQUATION PANEL (BOTTOM) -->
  <g transform="translate(15, 485)">
    <rect x="0" y="0" width="770" height="50" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="3" />
    <text x="25" y="32" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#1c1c1c">
      Flow (<tspan font-style="italic">Q</tspan>) = Pressure (<tspan font-style="italic">P</tspan>) / Resistance (<tspan font-style="italic">R</tspan>) + Compliance (<tspan font-style="italic">C</tspan>) × d<tspan font-style="italic">P</tspan>/d<tspan font-style="italic">t</tspan>
    </text>
  </g>

  <!-- Title / Figure label -->
  <text x="50" y="35" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">Fig. 5 — Transient Pulsatile Flow &amp; Windkessel Compliance</text>
</svg>
