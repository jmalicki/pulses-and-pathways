<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulses and Pathways</title>
  <style>
    body {
      background-color: #faf8f5;
      color: #333;
      font-family: Georgia, serif;
      line-height: 1.8;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }
    .title-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .title-page img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 2rem;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 3rem auto;
      border-radius: 4px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-align: center;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: normal;
      color: #555;
      text-align: center;
      margin-bottom: 2rem;
    }
    h3 {
      text-align: center;
      margin-top: 4rem;
      font-size: 2rem;
      border-bottom: 1px solid #ccc;
      padding-bottom: 0.5rem;
    }
    p {
      margin-bottom: 1.5rem;
    }
    hr {
      border: 0;
      height: 1px;
      background: #ccc;
      margin: 4rem 0;
    }
  </style>
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>
