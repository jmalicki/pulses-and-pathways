[project]
name = "voice-audit"
version = "0.1.0"
description = "Dialogue extract/scan and mark store for Pulses & Pathways voice audits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
voice-audit = "voice_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_audit"]

[dependency-groups]
dev = [
  "ruff>=0.11.0",
  "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
