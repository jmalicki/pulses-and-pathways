<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#f2efe3" />
  <defs>
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
      <feGaussianBlur stdDeviation="0.4" in="displaced" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" opacity="0.4" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#pencil)" stroke="#3a3a3a" fill="none" stroke-width="2">
    <!-- Patient Arm/Wound -->
    <path d="M 100 400 Q 400 350 700 400" stroke-width="3" stroke="#5a5a5a" />
    <path d="M 100 600 Q 400 650 700 600" stroke-width="3" stroke="#5a5a5a" />
    
    <!-- Open wound -->
    <path d="M 250 500 C 350 400, 450 400, 550 500 C 450 600, 350 600, 250 500 Z" stroke-width="1.5" stroke="#3a3a3a" />
    
    <!-- Artery -->
    <path d="M 280 500 C 350 480, 450 480, 520 500" stroke-width="4" stroke="#4a4a4a" />
    <path d="M 280 520 C 350 500, 450 500, 520 520" stroke-width="4" stroke="#4a4a4a" />
    
    <!-- Blood drops -->
    <path d="M 400 510 Q 405 520 400 530 Q 395 520 400 510" fill="#3a3a3a" stroke="none" />
    
    <!-- Clamps (DeBakey) -->
    <!-- Clamp 1 -->
    <path d="M 330 490 L 250 200" stroke-width="3" />
    <path d="M 340 495 L 280 200" stroke-width="3" />
    <!-- Clamp 1 handle/rings -->
    <circle cx="240" cy="180" r="20" />
    <circle cx="290" cy="180" r="20" />
    <path d="M 320 450 L 350 455" stroke-width="1" /> <!-- Ratchet -->
    
    <!-- Clamp 2 -->
    <path d="M 470 490 L 600 200" stroke-width="3" />
    <path d="M 460 495 L 560 200" stroke-width="3" />
    <circle cx="610" cy="180" r="20" />
    <circle cx="550" cy="180" r="20" />

    <!-- Surgeon's hands -->
    <path d="M 150 150 C 200 100, 250 150, 240 180" stroke-width="2" />
    <path d="M 200 100 C 250 80, 300 120, 290 180" stroke-width="2" />
    
    <path d="M 700 150 C 650 100, 600 150, 610 180" stroke-width="2" />
    <path d="M 650 100 C 600 80, 550 120, 550 180" stroke-width="2" />

    <!-- Cross-hatching for depth -->
    <path d="M 300 420 L 320 440 M 310 425 L 330 445 M 350 420 L 370 440 M 450 550 L 470 570 M 460 550 L 480 570" stroke-width="1" stroke="#5a5a5a" />
  </g>
</svg>
