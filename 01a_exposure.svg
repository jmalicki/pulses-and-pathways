<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="disp" />
      <feGaussianBlur in="disp" stdDeviation="0.8" />
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.98 0 0 0  0 0.96 0 0 0  0 0 0 0.1 0" />
      <feBlend mode="multiply" in="SourceGraphic" in2="noise" />
    </filter>
    <pattern id="hatch-tissue" width="8" height="8" patternTransform="rotate(30)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#5a5a5a" stroke-width="0.5" opacity="0.7" filter="url(#pencil)"/>
    </pattern>
    <pattern id="hatch-deep" width="12" height="12" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#3a3a3a" stroke-width="0.8" opacity="0.8" filter="url(#pencil)"/>
      <line x1="0" y1="0" x2="12" y2="0" stroke="#3a3a3a" stroke-width="0.8" opacity="0.8" filter="url(#pencil)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf8f5" filter="url(#paper)" />

  <!-- Incision opening / Retracted edges -->
  <path d="M 200 400 C 300 200 500 200 600 400 C 500 600 300 600 200 400" fill="url(#hatch-deep)" stroke="#3a3a3a" stroke-width="2.5" filter="url(#pencil)"/>
  
  <!-- Skin surface -->
  <path d="M 100 200 C 300 100 500 100 700 200 C 650 300 600 350 600 400 C 500 200 300 200 200 400 C 150 350 120 300 100 200" fill="url(#hatch-tissue)" stroke="none" filter="url(#pencil)"/>
  
  <!-- Subcutaneous fat and fascia layer -->
  <path d="M 210 400 C 310 230 490 230 590 400 C 490 570 310 570 210 400" fill="none" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#pencil)"/>

  <!-- Bleeding vessel -->
  <path d="M 300 400 C 350 380 450 420 500 400" fill="none" stroke="#3a3a3a" stroke-width="4" filter="url(#pencil)"/>
  <!-- Blood pooling / hematoma (darker hatching) -->
  <ellipse cx="380" cy="420" rx="40" ry="25" fill="#3a3a3a" opacity="0.4" filter="url(#pencil)"/>

  <!-- Retractors -->
  <!-- Left Retractor -->
  <path d="M 50 380 L 180 380 C 190 380 200 390 200 400 C 200 410 190 420 180 420 L 50 420 Z" fill="none" stroke="#3a3a3a" stroke-width="2" filter="url(#pencil)"/>
  <!-- Right Retractor -->
  <path d="M 750 380 L 620 380 C 610 380 600 390 600 400 C 600 410 610 420 620 420 L 750 420 Z" fill="none" stroke="#3a3a3a" stroke-width="2" filter="url(#pencil)"/>

  <!-- Suction Tip clearing hematoma -->
  <path d="M 450 100 L 400 380 C 395 400 385 410 375 420" fill="none" stroke="#4a4a4a" stroke-width="3" filter="url(#pencil)"/>
  <circle cx="375" cy="420" r="4" fill="#faf8f5" stroke="#3a3a3a" stroke-width="1.5" filter="url(#pencil)"/>
  
  <!-- Hand holding suction -->
  <path d="M 430 150 C 480 180 500 120 460 80" fill="none" stroke="#5a5a5a" stroke-width="1.5" filter="url(#pencil)"/>

  <!-- Labels -->
  <text x="350" y="470" font-family="Georgia, serif" font-size="16" fill="#3a3a3a" filter="url(#pencil)">Hematoma / Bleeding Vessel</text>
  <line x1="380" y1="430" x2="380" y2="455" stroke="#3a3a3a" stroke-width="1" filter="url(#pencil)"/>
  
  <text x="630" y="360" font-family="Georgia, serif" font-size="16" fill="#3a3a3a" filter="url(#pencil)">Retractor</text>
  <line x1="640" y1="380" x2="640" y2="365" stroke="#3a3a3a" stroke-width="1" filter="url(#pencil)"/>
</svg>
