<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="disp" />
      <feGaussianBlur in="disp" stdDeviation="0.8" />
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.98 0 0 0  0 0.96 0 0 0  0 0 0 0.1 0" />
      <feBlend mode="multiply" in="SourceGraphic" in2="noise" />
    </filter>
    <pattern id="hatch-tissue" width="10" height="10" patternTransform="rotate(20)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5a5a5a" stroke-width="0.5" opacity="0.6" filter="url(#pencil)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf8f5" filter="url(#paper)" />

  <!-- Surrounding Tissue -->
  <path d="M 100 200 C 300 150 500 150 700 200 C 750 400 750 600 700 800 C 500 750 300 750 100 800 Z" fill="url(#hatch-tissue)" opacity="0.4"/>
  <ellipse cx="400" cy="500" rx="250" ry="150" fill="#faf8f5" filter="url(#pencil)"/>
  <ellipse cx="400" cy="500" rx="250" ry="150" fill="none" stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#pencil)"/>

  <!-- Sutured Artery -->
  <!-- Artery walls -->
  <path d="M 200 520 C 300 480 500 520 600 480" fill="none" stroke="#3a3a3a" stroke-width="3" filter="url(#pencil)"/>
  <path d="M 200 480 C 300 440 500 480 600 440" fill="none" stroke="#3a3a3a" stroke-width="3" filter="url(#pencil)"/>
  
  <!-- Suture line (anastomosis/repair) -->
  <g filter="url(#pencil)">
    <path d="M 400 440 L 400 500" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <line x1="395" y1="450" x2="405" y2="450" stroke="#2a2a2a" stroke-width="1.5"/>
    <line x1="395" y1="465" x2="405" y2="465" stroke="#2a2a2a" stroke-width="1.5"/>
    <line x1="395" y1="480" x2="405" y2="480" stroke="#2a2a2a" stroke-width="1.5"/>
    <line x1="395" y1="495" x2="405" y2="495" stroke="#2a2a2a" stroke-width="1.5"/>
  </g>

  <!-- Pulsing indication (sound waves / expanding rings) -->
  <path d="M 450 430 C 470 410 490 410 510 430" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3,3" filter="url(#pencil)"/>
  <path d="M 440 420 C 470 390 500 390 520 420" fill="none" stroke="#5a5a5a" stroke-width="1" stroke-dasharray="3,3" filter="url(#pencil)"/>

  <!-- Sterile Doppler Ultrasound Probe (metal pen like) -->
  <path d="M 500 150 L 450 460" fill="none" stroke="#3a3a3a" stroke-width="6" filter="url(#pencil)"/>
  <path d="M 495 150 L 505 150 L 455 460 L 445 460 Z" fill="none" stroke="#4a4a4a" stroke-width="1.5" filter="url(#pencil)"/>
  <!-- Cord from probe -->
  <path d="M 500 150 C 550 100 650 150 750 50" fill="none" stroke="#3a3a3a" stroke-width="2" filter="url(#pencil)"/>
  
  <!-- Surgeon's Gloved Hand holding probe -->
  <path d="M 560 250 C 510 270 470 230 480 300 C 500 320 540 280 570 280" fill="none" stroke="#5a5a5a" stroke-width="2" filter="url(#pencil)"/>
  <path d="M 480 300 C 460 350 500 370 520 340" fill="none" stroke="#5a5a5a" stroke-width="2" filter="url(#pencil)"/>

  <!-- Labels -->
  <text x="420" y="550" font-family="Georgia, serif" font-size="16" fill="#3a3a3a" filter="url(#pencil)">Sutured Artery Repair</text>
  <line x1="400" y1="505" x2="420" y2="535" stroke="#3a3a3a" stroke-width="1" filter="url(#pencil)"/>

  <text x="600" y="320" font-family="Georgia, serif" font-size="16" fill="#3a3a3a" filter="url(#pencil)">Doppler Probe</text>
  <line x1="480" y1="320" x2="590" y2="315" stroke="#3a3a3a" stroke-width="1" filter="url(#pencil)"/>

</svg>
