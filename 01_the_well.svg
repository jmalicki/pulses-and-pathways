<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
  <defs>
    <!-- Rock hatching pattern -->
    <pattern id="earth-hatch" width="20" height="20" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#c0b9af" stroke-width="1" />
      <line x1="5" y1="0" x2="5" y2="20" stroke="#c0b9af" stroke-width="0.5" stroke-dasharray="2,2" />
    </pattern>
    <!-- Casing metal hatching pattern -->
    <pattern id="metal-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1e3d59" stroke-width="1.5" />
    </pattern>
    <!-- Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3d59" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a5a5a" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1c1c1c" />
    </marker>
  </defs>

  <!-- Cream background -->
  <rect width="100%" height="100%" fill="#faf8f5" />

  <!-- Grid lines (Drafting style) -->
  <line x1="40" y1="50" x2="760" y2="50" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="500" x2="760" y2="500" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="400" y1="30" x2="400" y2="520" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <!-- SECTION 1: WELLBORE SKETCH (LEFT) -->
  <g transform="translate(0, 0)">
    <!-- Earth/Formation Fill -->
    <rect x="50" y="100" width="80" height="350" fill="url(#earth-hatch)" />
    <rect x="270" y="100" width="80" height="350" fill="url(#earth-hatch)" />

    <!-- Casing Outer Lines -->
    <line x1="130" y1="100" x2="130" y2="450" stroke="#1e3d59" stroke-width="2.5" />
    <line x1="270" y1="100" x2="270" y2="450" stroke="#1e3d59" stroke-width="2.5" />

    <!-- Casing Hatching/Thickness -->
    <rect x="126" y="100" width="4" height="350" fill="url(#metal-hatch)" />
    <rect x="270" y="100" width="4" height="350" fill="url(#metal-hatch)" />

    <!-- Drill Pipe (Inner String) -->
    <line x1="175" y1="80" x2="175" y2="440" stroke="#1e3d59" stroke-width="2" />
    <line x1="225" y1="80" x2="225" y2="440" stroke="#1e3d59" stroke-width="2" />
    
    <!-- Pipe wall details (double line) -->
    <line x1="178" y1="80" x2="178" y2="440" stroke="#1e3d59" stroke-width="0.5" />
    <line x1="222" y1="80" x2="222" y2="440" stroke="#1e3d59" stroke-width="0.5" />

    <!-- Drill Bit / Bottom of Pipe -->
    <path d="M 175 440 L 185 450 L 215 450 L 225 440 Z" fill="none" stroke="#1e3d59" stroke-width="2" />
    <circle cx="190" cy="447" r="2" fill="#1e3d59" />
    <circle cx="200" cy="447" r="2" fill="#1e3d59" />
    <circle cx="210" cy="447" r="2" fill="#1e3d59" />

    <!-- Wellhead Flange (Top) -->
    <rect x="110" y="90" width="180" height="10" fill="none" stroke="#1e3d59" stroke-width="2" />
    <line x1="120" y1="90" x2="120" y2="100" stroke="#1e3d59" stroke-width="2" />
    <line x1="280" y1="90" x2="280" y2="100" stroke="#1e3d59" stroke-width="2" />
    
    <!-- Flow directions -->
    <!-- Down inside drill pipe -->
    <path d="M 200 120 L 200 160" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 200 280 L 200 320" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    
    <!-- Up in Annulus -->
    <path d="M 152 350 L 152 310" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 248 350 L 248 310" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 152 210 L 152 170" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 248 210 L 248 170" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Centerline -->
    <line x1="200" y1="70" x2="200" y2="470" stroke="#5a5a5a" stroke-width="0.8" stroke-dasharray="15,4,3,4" />

    <!-- Dimension: r_p (drill pipe radius) -->
    <line x1="200" y1="190" x2="225" y2="190" stroke="#1e3d59" stroke-width="1" />
    <circle cx="200" cy="190" r="1.5" fill="#1e3d59" />
    <circle cx="225" cy="190" r="1.5" fill="#1e3d59" />
    <text x="208" y="185" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">r<tspan font-size="8" dy="3">p</tspan></text>

    <!-- Dimension: r_c (casing radius) -->
    <line x1="200" y1="240" x2="270" y2="240" stroke="#1e3d59" stroke-width="1" />
    <circle cx="200" cy="240" r="1.5" fill="#1e3d59" />
    <circle cx="270" cy="240" r="1.5" fill="#1e3d59" />
    <text x="230" y="235" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">r<tspan font-size="8" dy="3">c</tspan></text>

    <!-- Label: Mud density rho -->
    <text x="140" y="270" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#1e3d59">ρ</text>
    <text x="140" y="285" font-family="Georgia, serif" font-size="10" fill="#1e3d59">(mud)</text>

    <!-- Vertical Depth Axis (z) on wellbore -->
    <line x1="90" y1="100" x2="90" y2="430" stroke="#1c1c1c" stroke-width="1.2" marker-end="url(#arrow-black)" />
    <text x="75" y="425" font-family="Georgia, serif" font-size="14" fill="#1c1c1c">Depth <tspan font-style="italic">z</tspan></text>
    <!-- Start tick for z=0 -->
    <line x1="85" y1="100" x2="95" y2="100" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="72" y="104" font-family="Georgia, serif" font-size="11" fill="#1c1c1c">0</text>
  </g>

  <!-- SECTION 2: DEPTH VS HYDROSTATIC PRESSURE (RIGHT) -->
  <g transform="translate(420, 0)">
    <!-- Graph Grid Lines -->
    <line x1="80" y1="100" x2="280" y2="100" stroke="#e8e2d8" stroke-width="1" />
    <line x1="80" y1="187.5" x2="280" y2="187.5" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="275" x2="280" y2="275" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="362.5" x2="280" y2="362.5" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="450" x2="280" y2="450" stroke="#e8e2d8" stroke-width="1" />

    <!-- Axes -->
    <!-- Vertical Depth Axis (z) pointing downwards -->
    <line x1="80" y1="100" x2="80" y2="465" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-black)" />
    <!-- Horizontal Pressure Axis (P_h) pointing right -->
    <line x1="80" y1="100" x2="295" y2="100" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-black)" />

    <!-- Explicit Labels for Axes with Full Name + LaTeX style variable -->
    <!-- Vertical axis (Depth z) placed to the left of the y-axis (rotated -90) -->
    <text x="45" y="275" font-family="Georgia, serif" font-size="13" fill="#1c1c1c" transform="rotate(-90 45 275)" text-anchor="middle">Depth <tspan font-style="italic">z</tspan></text>
    
    <!-- Horizontal axis (Hydrostatic Pressure P_h) placed above the x-axis -->
    <text x="180" y="75" font-family="Georgia, serif" font-size="13" fill="#1c1c1c" text-anchor="middle">Hydrostatic Pressure <tspan font-style="italic">P</tspan><tspan font-size="9" dy="4">h</tspan></text>

    <!-- Hydrostatic Pressure Curve (Linear: P = rho * g * z) -->
    <!-- z=0 (y=100) -> P=0 (x=80) -->
    <!-- z=max (y=450) -> P=max (x=260) -->
    <line x1="80" y1="100" x2="260" y2="450" stroke="#1e3d59" stroke-width="2.5" />
    
    <!-- Shading area under curve (pencil hatch style) -->
    <path d="M 80 143.75 L 102.5 143.75 M 80 187.5 L 125 187.5 M 80 231.25 L 147.5 231.25 M 80 275 L 170 275 M 80 318.75 L 192.5 318.75 M 80 362.5 L 215 362.5 M 80 406.25 L 237.5 406.25 M 80 450 L 260 450" stroke="#b0c4de" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Projection Lines from Wellbore (Left) to Graph (Right) -->
    <!-- Level 1 (z1) -->
    <line x1="-220" y1="200" x2="131.4" y2="200" stroke="#5a5a5a" stroke-width="0.8" stroke-dasharray="4,4" />
    <circle cx="131.4" cy="200" r="3" fill="#1e3d59" />
    <!-- Level 2 (z2) -->
    <line x1="-220" y1="350" x2="208.6" y2="350" stroke="#5a5a5a" stroke-width="0.8" stroke-dasharray="4,4" />
    <circle cx="208.6" cy="350" r="3" fill="#1e3d59" />

    <!-- Equation Typeset -->
    <rect x="75" y="480" width="220" height="45" fill="#faf8f5" stroke="#e8e2d8" stroke-width="1" rx="3" />
    <text x="90" y="510" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#1c1c1c">
      <tspan font-style="italic">P</tspan><tspan font-size="12" dy="4">h</tspan><tspan font-size="18" dy="-4"> = </tspan><tspan font-style="italic">ρg z</tspan>
    </text>
  </g>

  <!-- Title / Figure label -->
  <text x="50" y="45" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">Fig. 1 — Hydrostatic Pressure in a Wellbore</text>
</svg>
