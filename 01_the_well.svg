<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 980" width="100%" height="100%">
  <defs>
    <pattern id="earth-hatch" width="20" height="20" patternTransform="rotate(30 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#c0b9af" stroke-width="1" />
      <line x1="5" y1="0" x2="5" y2="20" stroke="#c0b9af" stroke-width="0.5" stroke-dasharray="2,2" />
    </pattern>
    <pattern id="metal-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#1e3d59" stroke-width="1.5" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e3d59" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5a5a5a" />
    </marker>
    <marker id="arrow-black" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1c1c1c" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3" />
  <line x1="30" y1="40" x2="490" y2="40" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="30" y1="500" x2="490" y2="500" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="30" y1="920" x2="490" y2="920" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <text x="40" y="28" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c">Fig. 1 — Hydrostatic Pressure in a Wellbore</text>

  <!-- TOP: wellbore -->
  <g transform="translate(0, 10)">
    <text x="40" y="58" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">Wellbore layout</text>

    <rect x="50" y="90" width="70" height="340" fill="url(#earth-hatch)" />
    <rect x="250" y="90" width="70" height="340" fill="url(#earth-hatch)" />

    <line x1="120" y1="90" x2="120" y2="430" stroke="#1e3d59" stroke-width="2.5" />
    <line x1="250" y1="90" x2="250" y2="430" stroke="#1e3d59" stroke-width="2.5" />
    <rect x="116" y="90" width="4" height="340" fill="url(#metal-hatch)" />
    <rect x="250" y="90" width="4" height="340" fill="url(#metal-hatch)" />

    <line x1="160" y1="70" x2="160" y2="420" stroke="#1e3d59" stroke-width="2" />
    <line x1="210" y1="70" x2="210" y2="420" stroke="#1e3d59" stroke-width="2" />
    <line x1="163" y1="70" x2="163" y2="420" stroke="#1e3d59" stroke-width="0.5" />
    <line x1="207" y1="70" x2="207" y2="420" stroke="#1e3d59" stroke-width="0.5" />

    <path d="M 160 420 L 170 430 L 200 430 L 210 420 Z" fill="none" stroke="#1e3d59" stroke-width="2" />
    <circle cx="175" cy="427" r="2" fill="#1e3d59" />
    <circle cx="185" cy="427" r="2" fill="#1e3d59" />
    <circle cx="195" cy="427" r="2" fill="#1e3d59" />

    <rect x="100" y="80" width="170" height="10" fill="none" stroke="#1e3d59" stroke-width="2" />
    <line x1="110" y1="80" x2="110" y2="90" stroke="#1e3d59" stroke-width="2" />
    <line x1="260" y1="80" x2="260" y2="90" stroke="#1e3d59" stroke-width="2" />

    <path d="M 185 110 L 185 150" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 185 270 L 185 310" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 140 340 L 140 300" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 230 340 L 230 300" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 140 200 L 140 160" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />
    <path d="M 230 200 L 230 160" stroke="#1e3d59" stroke-width="1.5" marker-end="url(#arrow)" />

    <line x1="185" y1="60" x2="185" y2="450" stroke="#5a5a5a" stroke-width="0.8" stroke-dasharray="15,4,3,4" />

    <line x1="185" y1="180" x2="210" y2="180" stroke="#1e3d59" stroke-width="1" />
    <circle cx="185" cy="180" r="1.5" fill="#1e3d59" />
    <circle cx="210" cy="180" r="1.5" fill="#1e3d59" />
    <text x="192" y="175" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">r<tspan font-size="8" dy="3">p</tspan></text>

    <line x1="185" y1="230" x2="250" y2="230" stroke="#1e3d59" stroke-width="1" />
    <circle cx="185" cy="230" r="1.5" fill="#1e3d59" />
    <circle cx="250" cy="230" r="1.5" fill="#1e3d59" />
    <text x="210" y="225" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">r<tspan font-size="8" dy="3">c</tspan></text>

    <text x="128" y="265" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#1e3d59">ρ</text>
    <text x="125" y="280" font-family="Georgia, serif" font-size="10" fill="#1e3d59">(mud)</text>

    <line x1="80" y1="90" x2="80" y2="410" stroke="#1c1c1c" stroke-width="1.2" marker-end="url(#arrow-black)" />
    <text x="55" y="405" font-family="Georgia, serif" font-size="13" fill="#1c1c1c">Depth <tspan font-style="italic">z</tspan></text>
    <line x1="75" y1="90" x2="85" y2="90" stroke="#1c1c1c" stroke-width="1.2" />
    <text x="62" y="94" font-family="Georgia, serif" font-size="11" fill="#1c1c1c">0</text>

    <text x="335" y="140" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Formation Rock</text>
    <path d="M 330 136 L 310 136" stroke="#5a5a5a" stroke-width="1" marker-end="url(#arrow-gray)" />

    <text x="335" y="190" font-family="Georgia, serif" font-size="12" fill="#1e3d59">Steel Casing</text>
    <path d="M 330 186 L 255 186" stroke="#1e3d59" stroke-width="1" marker-end="url(#arrow)" />

    <text x="335" y="255" font-family="Georgia, serif" font-size="12" fill="#1e3d59">Wellbore Annulus</text>
    <text x="335" y="270" font-family="Georgia, serif" font-size="10" fill="#5a5a5a">(Mud flows up)</text>
    <path d="M 330 251 L 235 251" stroke="#1e3d59" stroke-width="1" marker-end="url(#arrow)" />

    <text x="335" y="330" font-family="Georgia, serif" font-size="12" fill="#1e3d59">Drill Pipe</text>
    <text x="335" y="345" font-family="Georgia, serif" font-size="10" fill="#5a5a5a">(Mud pumped down)</text>
    <path d="M 330 326 L 215 326" stroke="#1e3d59" stroke-width="1" marker-end="url(#arrow)" />

    <text x="335" y="430" font-family="Georgia, serif" font-size="12" fill="#1e3d59">Drill Bit</text>
    <path d="M 330 426 L 215 426" stroke="#1e3d59" stroke-width="1" marker-end="url(#arrow)" />
  </g>

  <!-- BOTTOM: pressure graph -->
  <g transform="translate(0, 500)">
    <text x="40" y="28" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">Depth vs hydrostatic pressure</text>

    <line x1="80" y1="60" x2="440" y2="60" stroke="#e8e2d8" stroke-width="1" />
    <line x1="80" y1="140" x2="440" y2="140" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="220" x2="440" y2="220" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="300" x2="440" y2="300" stroke="#e8e2d8" stroke-width="0.8" stroke-dasharray="4,4" />
    <line x1="80" y1="380" x2="440" y2="380" stroke="#e8e2d8" stroke-width="1" />

    <line x1="80" y1="60" x2="80" y2="395" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-black)" />
    <line x1="80" y1="60" x2="455" y2="60" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-black)" />

    <text x="45" y="220" font-family="Georgia, serif" font-size="13" fill="#1c1c1c" transform="rotate(-90 45 220)" text-anchor="middle">Depth <tspan font-style="italic">z</tspan></text>
    <text x="260" y="48" font-family="Georgia, serif" font-size="13" fill="#1c1c1c" text-anchor="middle">Hydrostatic Pressure <tspan font-style="italic">P</tspan><tspan font-size="9" dy="4">h</tspan></text>

    <line x1="80" y1="60" x2="400" y2="380" stroke="#1e3d59" stroke-width="2.5" />
    <path d="M 80 100 L 120 100 M 80 140 L 160 140 M 80 180 L 200 180 M 80 220 L 240 220 M 80 260 L 280 260 M 80 300 L 320 300 M 80 340 L 360 340 M 80 380 L 400 380" stroke="#b0c4de" stroke-width="1" stroke-dasharray="2,2" />

    <circle cx="160" cy="140" r="3.5" fill="#1e3d59" />
    <circle cx="300" cy="280" r="3.5" fill="#1e3d59" />
  </g>

  <g transform="translate(30, 920)">
    <rect x="0" y="0" width="460" height="48" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1" rx="3" />
    <text x="14" y="30" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#1c1c1c">
      <tspan font-style="italic">P</tspan><tspan font-size="9" dy="3">h</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">ρ g z</tspan>
      <tspan fill="#5a5a5a">  ·  hydrostatic pressure rises linearly with depth</tspan>
    </text>
  </g>
</svg>
