<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c94a4a" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3" />
  <text x="28" y="32" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c">Cavitation collapse (uncavitation)</text>
  <text x="28" y="52" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Pressure recovers; vapor condenses; liquid driven in by delta-P; damage at a wall</text>

  <!-- (a) -->
  <g transform="translate(20, 70)">
    <text x="10" y="18" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">(a) Cavity</text>
    <circle cx="90" cy="100" r="42" fill="#f2efe3" stroke="#3a3a3a" stroke-width="1.6" stroke-dasharray="3,2" />
    <text x="68" y="96" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">P low</text>
    <text x="62" y="112" font-family="Georgia, serif" font-size="10" fill="#5a5a5a">(~ P_vapor)</text>
    <text x="145" y="90" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">P higher</text>
    <text x="145" y="108" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">outside</text>
  </g>

  <!-- (b) -->
  <g transform="translate(280, 70)">
    <text x="10" y="18" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">(b) P recovers</text>
    <circle cx="90" cy="100" r="28" fill="#f2efe3" stroke="#3a3a3a" stroke-width="1.6" />
    <text x="58" y="96" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">vapor to</text>
    <text x="62" y="112" font-family="Georgia, serif" font-size="11" fill="#3a3a3a">liquid</text>
    <text x="140" y="100" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">volume shrinks</text>
  </g>

  <!-- (c) -->
  <g transform="translate(540, 70)">
    <text x="10" y="18" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">(c) Liquid driven in</text>
    <circle cx="90" cy="100" r="16" fill="#f2efe3" stroke="#c94a4a" stroke-width="1.8" />
    <line x1="40" y1="100" x2="68" y2="100" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <line x1="140" y1="100" x2="112" y2="100" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <line x1="90" y1="50" x2="90" y2="78" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <line x1="90" y1="150" x2="90" y2="122" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <text x="40" y="175" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">delta-P drives inflow</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="280" x2="760" y2="280" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,6" />

  <!-- (d) bulk vs wall -->
  <g transform="translate(40, 300)">
    <text x="0" y="18" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">(d) Bulk fluid vs wall</text>

    <!-- bulk -->
    <text x="20" y="48" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Mid-stream</text>
    <circle cx="70" cy="110" r="22" fill="#f2efe3" stroke="#3a3a3a" stroke-width="1.4" />
    <line x1="30" y1="110" x2="48" y2="110" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="110" y1="110" x2="92" y2="110" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="70" y1="70" x2="70" y2="88" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arr)" />
    <line x1="70" y1="150" x2="70" y2="132" stroke="#3a3a3a" stroke-width="1.2" marker-end="url(#arr)" />
    <text x="20" y="180" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">mostly churns liquid</text>

    <!-- wall -->
    <text x="220" y="48" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Against a wall</text>
    <rect x="200" y="70" width="18" height="100" fill="#d8d2c8" stroke="#3a3a3a" stroke-width="1.4" />
    <text x="198" y="190" font-family="Georgia, serif" font-size="10" fill="#3a3a3a">metal</text>
    <circle cx="260" cy="120" r="20" fill="#f2efe3" stroke="#c94a4a" stroke-width="1.6" />
    <line x1="300" y1="120" x2="282" y2="120" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <line x1="260" y1="80" x2="260" y2="98" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <line x1="260" y1="160" x2="260" y2="142" stroke="#c94a4a" stroke-width="1.5" marker-end="url(#arr-red)" />
    <path d="M 248 110 L 218 120 L 248 130" fill="none" stroke="#c94a4a" stroke-width="1.5" />
    <text x="220" y="210" font-family="Georgia, serif" font-size="11" fill="#c94a4a">collapse onto the surface</text>
  </g>

  <!-- (e) pit -->
  <g transform="translate(480, 300)">
    <text x="0" y="18" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">(e) Pit</text>
    <rect x="20" y="50" width="200" height="28" fill="#d8d2c8" stroke="#3a3a3a" stroke-width="1.4" />
    <path d="M 100 50 L 110 78 L 120 50" fill="#f2efe3" stroke="#c94a4a" stroke-width="1.6" />
    <text x="20" y="110" font-family="Georgia, serif" font-size="12" fill="#3a3a3a">Repeated hits pit through steel</text>
    <text x="20" y="132" font-family="Georgia, serif" font-size="11" fill="#5a5a5a">(impeller face, pipe wall, choke bean)</text>
  </g>
</svg>
