<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="100%" height="100%">
  <defs>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#c94a4a" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f2efe3" />
  <text x="32" y="36" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c">Fig. 6 &#8212; Vapor pressure (formation)</text>
  <text x="32" y="56" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Drop pressure at fixed temperature until liquid becomes vapor</text>

  <!-- Axes -->
  <line x1="80" y1="340" x2="360" y2="340" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
  <line x1="80" y1="340" x2="80" y2="90" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
  <text x="340" y="362" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">T</text>
  <text x="52" y="100" font-family="Georgia, serif" font-size="13" fill="#3a3a3a">P</text>

  <!-- Vapor-pressure curve -->
  <path d="M 110 300 C 160 280, 200 230, 250 170 C 280 130, 310 110, 340 100"
        fill="none" stroke="#3a3a3a" stroke-width="2" />

  <!-- Phase regions: liquid above the curve; vapor below and strictly right of the isotherm -->
  <text x="130" y="200" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5a5a5a">liquid</text>
  <text x="275" y="310" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#5a5a5a">vapor</text>

  <!-- Isotherm drop (fixed T) -->
  <line x1="220" y1="120" x2="220" y2="330" stroke="#c94a4a" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-red)" />
  <circle cx="220" cy="120" r="4" fill="#c94a4a" />
  <circle cx="220" cy="255" r="4" fill="none" stroke="#c94a4a" stroke-width="1.5" />
  <text x="232" y="116" font-family="Georgia, serif" font-size="11" fill="#c94a4a">start (liquid)</text>
  <text x="236" y="252" font-family="Georgia, serif" font-size="11" fill="#c94a4a">cross curve</text>
  <text x="236" y="268" font-family="Georgia, serif" font-size="11" fill="#c94a4a">to vapor</text>
  <!-- Tick + label below the T-axis, clear of the isotherm -->
  <line x1="220" y1="340" x2="220" y2="348" stroke="#3a3a3a" stroke-width="1.2" />
  <text x="220" y="366" font-family="Georgia, serif" font-size="11" fill="#3a3a3a" text-anchor="middle">fixed T</text>

  <!-- Side note -->
  <rect x="400" y="100" width="210" height="200" fill="none" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="6,4" />
  <text x="416" y="128" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#1c1c1c">Not heating</text>
  <text x="416" y="152" font-family="Georgia, serif" font-size="12" fill="#3a3a3a">Same temperature.</text>
  <text x="416" y="172" font-family="Georgia, serif" font-size="12" fill="#3a3a3a">Pressure falls below</text>
  <text x="416" y="192" font-family="Georgia, serif" font-size="12" fill="#3a3a3a">vapor pressure</text>
  <text x="416" y="212" font-family="Georgia, serif" font-size="12" fill="#3a3a3a">liquid flashes to vapor.</text>
  <text x="416" y="248" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Cavity pressure &#8776;</text>
  <text x="416" y="268" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">vapor pressure (low).</text>
</svg>
