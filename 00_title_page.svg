<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Graphite texture filters -->
    <filter id="pencil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" result="disp" />
      <feGaussianBlur in="disp" stdDeviation="0.8" />
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="3" result="noise" />
      <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.98 0 0 0  0 0.96 0 0 0  0 0 0 0.1 0" />
      <feBlend mode="multiply" in="SourceGraphic" in2="noise" />
    </filter>
    <!-- Crosshatch pattern -->
    <pattern id="hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#5a5a5a" stroke-width="0.8" opacity="0.6" filter="url(#pencil)"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#faf8f5" filter="url(#paper)" />

  <!-- Title -->
  <text x="400" y="150" font-family="Georgia, serif" font-size="48" font-style="italic" fill="#3a3a3a" text-anchor="middle" filter="url(#pencil)">Pulses and Pathways</text>
  <text x="400" y="200" font-family="Georgia, serif" font-size="20" fill="#4a4a4a" text-anchor="middle" filter="url(#pencil)">a Vascular Surgeon meets a Petroleum Engineer</text>
  <line x1="150" y1="230" x2="650" y2="230" stroke="#3a3a3a" stroke-width="1.5" filter="url(#pencil)"/>

  <!-- Sketch: OR Scene -->
  <!-- Dr. Hayes -->
  <path d="M 300 400 C 320 300 480 300 500 400 C 510 500 480 700 480 700 L 320 700 C 320 700 290 500 300 400" fill="none" stroke="#3a3a3a" stroke-width="2" filter="url(#pencil)"/>
  <!-- Scrub cap -->
  <path d="M 320 350 C 350 310 450 310 480 350" fill="url(#hatch)" stroke="#3a3a3a" stroke-width="1.5" filter="url(#pencil)"/>
  <!-- Mask -->
  <path d="M 350 400 C 370 420 430 420 450 400" fill="none" stroke="#5a5a5a" stroke-width="1.5" filter="url(#pencil)"/>
  
  <!-- Arms working on table -->
  <path d="M 320 550 C 250 600 200 650 350 700" fill="none" stroke="#4a4a4a" stroke-width="2" filter="url(#pencil)"/>
  <path d="M 480 550 C 550 600 600 650 450 700" fill="none" stroke="#4a4a4a" stroke-width="2" filter="url(#pencil)"/>
  
  <!-- Operating Table/Arm -->
  <ellipse cx="400" cy="700" rx="150" ry="40" fill="none" stroke="#3a3a3a" stroke-width="1.5" filter="url(#pencil)"/>
  <rect x="250" y="700" width="300" height="150" fill="url(#hatch)" opacity="0.3"/>

  <!-- Stuart (intern) -->
  <path d="M 150 450 C 160 380 240 380 250 450 L 250 650 L 150 650 Z" fill="none" stroke="#5a5a5a" stroke-width="1.5" filter="url(#pencil)"/>
  <!-- Scrub cap and mask for Stuart -->
  <path d="M 160 410 C 180 380 220 380 240 410" fill="url(#hatch)" stroke="#5a5a5a" stroke-width="1" filter="url(#pencil)"/>
  
  <!-- Elena (nurse) managing instruments -->
  <path d="M 650 450 C 640 380 560 380 550 450 L 550 650 L 650 650 Z" fill="none" stroke="#5a5a5a" stroke-width="1.5" filter="url(#pencil)"/>
  <path d="M 640 410 C 620 380 580 380 560 410" fill="url(#hatch)" stroke="#5a5a5a" stroke-width="1" filter="url(#pencil)"/>
  <!-- Instrument tray -->
  <rect x="600" y="550" width="120" height="10" fill="none" stroke="#3a3a3a" stroke-width="1.5" filter="url(#pencil)"/>
  <line x1="660" y1="560" x2="660" y2="700" stroke="#3a3a3a" stroke-width="2" filter="url(#pencil)"/>

  <!-- Background shading -->
  <circle cx="400" cy="550" r="300" fill="url(#hatch)" opacity="0.15" filter="url(#pencil)"/>

</svg>
