<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f2efe3" />
  <text x="280" y="32" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Fig. 14 &#8212; Anastomosis: Pursed vs Revised</text>

  <!-- LEFT: pursed -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="240" height="390" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="120" y="28" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#c94a4a" text-anchor="middle">Pursed join</text>
    <text x="120" y="48" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" text-anchor="middle">cinched throat</text>

    <!-- Vessel outer walls - tapered at mid -->
    <path d="M 50 80
             L 50 160
             Q 50 190, 95 210
             Q 50 230, 50 260
             L 50 360"
          fill="none" stroke="#5a5a5a" stroke-width="2.5" />
    <path d="M 190 80
             L 190 160
             Q 190 190, 145 210
             Q 190 230, 190 260
             L 190 360"
          fill="none" stroke="#5a5a5a" stroke-width="2.5" />

    <!-- Lumen fill suggesting narrow throat -->
    <path d="M 70 80 L 70 165 Q 70 185, 110 210 Q 70 235, 70 255 L 70 360
             L 170 360 L 170 255 Q 170 235, 130 210 Q 170 185, 170 165 L 170 80 Z"
          fill="#c94a4a" fill-opacity="0.12" stroke="none" />

    <!-- Suture bites pulling inward at anastomosis -->
    <g stroke="#1c1c1c" stroke-width="1.4" fill="none">
      <path d="M 55 200 Q 85 210, 100 210" />
      <path d="M 185 200 Q 155 210, 140 210" />
      <path d="M 55 220 Q 85 210, 100 210" />
      <path d="M 185 220 Q 155 210, 140 210" />
    </g>
    <circle cx="100" cy="210" r="2.5" fill="#1c1c1c" />
    <circle cx="140" cy="210" r="2.5" fill="#1c1c1c" />
    <circle cx="110" cy="205" r="2" fill="#1c1c1c" />
    <circle cx="130" cy="205" r="2" fill="#1c1c1c" />
    <circle cx="110" cy="215" r="2" fill="#1c1c1c" />
    <circle cx="130" cy="215" r="2" fill="#1c1c1c" />

    <!-- Throat callout -->
    <line x1="120" y1="210" x2="175" y2="175" stroke="#c94a4a" stroke-width="1" />
    <text x="178" y="172" font-family="Georgia, serif" font-size="11" fill="#c94a4a">throat</text>

    <text x="120" y="385" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a5a5a" text-anchor="middle">high velocity / bad spectrum</text>
  </g>

  <!-- RIGHT: revised open -->
  <g transform="translate(290, 55)">
    <rect x="0" y="0" width="240" height="390" fill="#f2efe3" stroke="#e8e2d8" stroke-width="1.5" rx="5" />
    <text x="120" y="28" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1e3d59" text-anchor="middle">Revised join</text>
    <text x="120" y="48" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" text-anchor="middle">open lumen</text>

    <!-- Straight vessel -->
    <path d="M 55 80 L 55 360" fill="none" stroke="#5a5a5a" stroke-width="2.5" />
    <path d="M 185 80 L 185 360" fill="none" stroke="#5a5a5a" stroke-width="2.5" />
    <path d="M 70 80 L 70 360 L 170 360 L 170 80 Z"
          fill="#1e3d59" fill-opacity="0.08" stroke="none" />

    <!-- Neat suture line across anastomosis -->
    <line x1="55" y1="210" x2="185" y2="210" stroke="#1c1c1c" stroke-width="1" stroke-dasharray="2,3" />
    <g fill="#1c1c1c">
      <circle cx="70" cy="210" r="2.2" />
      <circle cx="90" cy="210" r="2.2" />
      <circle cx="110" cy="210" r="2.2" />
      <circle cx="130" cy="210" r="2.2" />
      <circle cx="150" cy="210" r="2.2" />
      <circle cx="170" cy="210" r="2.2" />
    </g>

    <text x="120" y="175" font-family="Georgia, serif" font-size="11" fill="#1e3d59" text-anchor="middle">anastomosis</text>
    <line x1="120" y1="180" x2="120" y2="200" stroke="#1e3d59" stroke-width="1" />

    <text x="120" y="385" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#5a5a5a" text-anchor="middle">triphasic / patent</text>
  </g>
</svg>
