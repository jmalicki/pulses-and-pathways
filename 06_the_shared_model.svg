<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%">
  <defs>
    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e3d59" />
    </marker>
    <marker id="arrow-charcoal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3a3a3a" />
    </marker>
  </defs>

  <!-- Cream background -->
  <rect width="100%" height="100%" fill="#faf8f5" />

  <!-- Grid lines -->
  <line x1="40" y1="40" x2="760" y2="40" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="540" x2="760" y2="540" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <!-- SECTION 1: UNIFIED CIRCUIT DIAGRAM (TOP) -->
  <g transform="translate(0, 0)">
    <text x="50" y="60" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Unified Hydraulic Circuit Model</text>

    <g transform="translate(50, 10)">
      <!-- Pump / Heart symbol -->
      <circle cx="20" cy="110" r="22" fill="none" stroke="#1e3d59" stroke-width="2" />
      <path d="M 10 110 L 32 100 L 32 120 Z" fill="#1e3d59" />
      <text x="20" y="145" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Pump / Heart</text>

      <!-- Main line from Pump to Compliance -->
      <line x1="42" y1="110" x2="160" y2="110" stroke="#1e3d59" stroke-width="2" />

      <!-- Compliance Chamber (Accumulator style) -->
      <circle cx="160" cy="110" r="3" fill="#1e3d59" />
      <line x1="160" y1="110" x2="160" y2="80" stroke="#1e3d59" stroke-width="2" />
      
      <!-- Accumulator body -->
      <rect x="145" y="40" width="30" height="40" fill="none" stroke="#1e3d59" stroke-width="2" rx="3" />
      <line x1="147" y1="60" x2="173" y2="60" stroke="#1e3d59" stroke-width="2.5" />
      <path d="M 160 40 L 160 44 L 155 48 L 165 52 L 155 56 L 160 60" fill="none" stroke="#1e3d59" stroke-width="1" />
      <text x="160" y="32" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59" text-anchor="middle">C</text>
      <text x="195" y="55" font-family="Georgia, serif" font-size="9" fill="#5a5a5a">Compliance</text>

      <!-- Main line to Constriction -->
      <line x1="160" y1="110" x2="240" y2="110" stroke="#1e3d59" stroke-width="2" />

      <!-- Constriction Resistor (Needle valve/Stenosis) -->
      <path d="M 240 110 L 255 100 L 255 120 L 270 110 Z" fill="#1e3d59" />
      <path d="M 240 110 L 270 110" stroke="#1e3d59" stroke-width="2" />
      <text x="255" y="93" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59" text-anchor="middle">R<tspan font-size="8" dy="3">s</tspan></text>
      <text x="255" y="132" font-family="Georgia, serif" font-size="9" fill="#5a5a5a" text-anchor="middle">Stenosis / Choke</text>

      <!-- Main line to Transducer -->
      <line x1="270" y1="110" x2="330" y2="110" stroke="#1e3d59" stroke-width="2" />

      <!-- Transducer sensor point (y_obs) -->
      <circle cx="330" cy="110" r="3" fill="#1e3d59" />
      <line x1="330" y1="110" x2="330" y2="70" stroke="#1c1c1c" stroke-width="1.2" />
      
      <!-- Sensor probe box -->
      <rect x="315" y="45" width="30" height="25" fill="#faf8f5" stroke="#1c1c1c" stroke-width="1.5" />
      <text x="330" y="61" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1c1c1c" text-anchor="middle">y<tspan font-size="8" dy="3">obs</tspan></text>
      <text x="330" y="38" font-family="Georgia, serif" font-size="9" fill="#1c1c1c" text-anchor="middle">Transducer</text>

      <!-- Main line to branching network -->
      <line x1="330" y1="110" x2="410" y2="110" stroke="#1e3d59" stroke-width="2" />

      <!-- Branching split -->
      <line x1="410" y1="70" x2="410" y2="150" stroke="#1e3d59" stroke-width="2" />
      
      <!-- Branch 1 (top) -->
      <line x1="410" y1="70" x2="430" y2="70" stroke="#1e3d59" stroke-width="2" />
      <path d="M 430 70 L 435 65 L 441 75 L 447 65 L 453 75 L 459 65 L 465 75 L 470 70" fill="none" stroke="#1e3d59" stroke-width="1.5" />
      <line x1="470" y1="70" x2="490" y2="70" stroke="#1e3d59" stroke-width="2" />
      <text x="450" y="58" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1e3d59">R<tspan font-size="8" dy="3">1</tspan></text>

      <!-- Branch 2 (middle) -->
      <path d="M 410 110 L 435 110 L 441 105 L 447 115 L 453 105 L 459 115 L 465 105 L 470 110 L 490 110" fill="none" stroke="#1e3d59" stroke-width="2" />
      <text x="450" y="98" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1e3d59">R<tspan font-size="8" dy="3">2</tspan></text>

      <!-- Branch 3 (bottom) -->
      <line x1="410" y1="150" x2="430" y2="150" stroke="#1e3d59" stroke-width="2" />
      <path d="M 430 150 L 435 145 L 441 155 L 447 145 L 453 155 L 459 145 L 465 155 L 470 150" fill="none" stroke="#1e3d59" stroke-width="1.5" />
      <line x1="470" y1="150" x2="490" y2="150" stroke="#1e3d59" stroke-width="2" />
      <text x="450" y="138" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1e3d59">R<tspan font-size="8" dy="3">3</tspan></text>

      <!-- Recombination -->
      <line x1="490" y1="70" x2="490" y2="150" stroke="#1e3d59" stroke-width="2" />
      <line x1="490" y1="110" x2="550" y2="110" stroke="#1e3d59" stroke-width="2" />

      <!-- Return line / Reservoir -->
      <rect x="550" y="95" width="40" height="30" fill="none" stroke="#1e3d59" stroke-width="2" />
      <text x="570" y="114" font-family="Georgia, serif" font-size="9" fill="#1e3d59" text-anchor="middle">Sump</text>
    </g>
  </g>

  <!-- SECTION 2: CONVERGENCE & MATH (BOTTOM) -->
  <g transform="translate(0, 210)">
    <text x="50" y="35" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#1c1c1c">Parameter Optimization Convergence</text>

    <!-- Main convergence plot (Left-Center) -->
    <g transform="translate(0, 20)">
      <!-- Axes -->
      <line x1="80" y1="220" x2="80" y2="50" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
      <line x1="80" y1="220" x2="440" y2="220" stroke="#1c1c1c" stroke-width="1.5" marker-end="url(#arrow-charcoal)" />
      
      <!-- Explicit Labels for Main Graph -->
      <!-- Y-Axis (Parameter Value x) rotated -90, to the left of the axis line -->
      <text x="45" y="135" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" transform="rotate(-90 45 135)" text-anchor="middle">Parameter Value <tspan font-style="italic">x</tspan></text>
      
      <!-- X-Axis (Iteration n) above the axis line -->
      <text x="380" y="210" font-family="Georgia, serif" font-size="12" fill="#1c1c1c" text-anchor="middle">Iteration <tspan font-style="italic">n</tspan></text>

      <!-- Parameter 1 (Resistance Rs) Convergence -->
      <line x1="80" y1="90" x2="420" y2="90" stroke="#1e3d59" stroke-width="1" stroke-dasharray="4,4" />
      <text x="425" y="94" font-family="Georgia, serif" font-size="11" fill="#1e3d59">R<tspan font-size="8" dy="3">s, true</tspan></text>
      <path d="M 80 200 
               Q 130 60, 180 110 
               Q 230 80, 280 93 
               Q 330 88, 380 90 
               L 420 90" 
            fill="none" stroke="#1e3d59" stroke-width="2.5" />

      <!-- Parameter 2 (Compliance C) Convergence -->
      <line x1="80" y1="150" x2="420" y2="150" stroke="#c94a4a" stroke-width="1" stroke-dasharray="4,4" />
      <text x="425" y="154" font-family="Georgia, serif" font-size="11" fill="#c94a4a">C<tspan font-size="8" dy="3">true</tspan></text>
      <path d="M 80 70 
               Q 130 180, 180 135 
               Q 230 160, 280 148 
               Q 330 151, 380 150 
               L 420 150" 
            fill="none" stroke="#c94a4a" stroke-width="2.5" />

      <circle cx="80" cy="200" r="3.5" fill="#1e3d59" />
      <circle cx="80" cy="70" r="3.5" fill="#c94a4a" />
      <text x="90" y="206" font-family="Georgia, serif" font-size="10" fill="#1e3d59">Initial guess</text>
      <text x="90" y="66" font-family="Georgia, serif" font-size="10" fill="#c94a4a">Initial guess</text>
    </g>

    <!-- Cost Function Decay Inset (Right) -->
    <g transform="translate(480, 20)">
      <rect x="0" y="30" width="240" height="190" fill="#faf8f5" stroke="#e8e2d8" stroke-width="1" rx="3" />
      <text x="120" y="52" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#1c1c1c" text-anchor="middle">Error Minimization</text>

      <!-- Inset Axes -->
      <line x1="40" y1="190" x2="40" y2="70" stroke="#5a5a5a" stroke-width="1" marker-end="url(#arrow-charcoal)" />
      <line x1="40" y1="190" x2="210" y2="190" stroke="#5a5a5a" stroke-width="1" marker-end="url(#arrow-charcoal)" />
      
      <!-- Explicit Labels for Inset Graph -->
      <!-- Y-Axis (Cost J) rotated -90, to the left of the axis line -->
      <text x="15" y="130" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" transform="rotate(-90 15 130)" text-anchor="middle">Cost <tspan font-style="italic">J</tspan></text>
      
      <!-- X-Axis (Iteration n) above the axis line -->
      <text x="160" y="180" font-family="Georgia, serif" font-size="11" fill="#5a5a5a" text-anchor="middle">Iteration <tspan font-style="italic">n</tspan></text>

      <!-- Cost decay curve -->
      <path d="M 40 85 C 60 170, 90 188, 200 189.5" fill="none" stroke="#3a3a3a" stroke-width="2" />
      <text x="90" y="110" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" stroke-dasharray="1,1">J(x) → 0</text>
    </g>
  </g>

  <!-- SECTION 3: EQUATIONS PANEL (BOTTOM CENTER) -->
  <g transform="translate(140, 485)">
    <rect x="0" y="0" width="520" height="50" fill="#faf8f5" stroke="#e8e2d8" stroke-width="1" rx="3" />
    <text x="20" y="32" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#1c1c1c">
      <tspan font-style="italic">J(x)</tspan> = <tspan font-size="18">∑</tspan> [ <tspan font-style="italic">y<tspan font-size="10" dy="3">obs</tspan></tspan><tspan dy="-3"> - </tspan><tspan font-style="italic">y<tspan font-size="10" dy="3">calc</tspan></tspan>(<tspan font-style="italic" dy="-3">x</tspan>) ]<tspan font-size="10" dy="-5">2</tspan>
    </text>
    <line x1="280" y1="10" x2="280" y2="40" stroke="#e8e2d8" stroke-width="1" />
    <text x="300" y="32" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#1c1c1c">
      <tspan font-style="italic">Q</tspan> = -<tspan font-style="italic">kA</tspan>/<tspan font-style="italic">μ · dP</tspan>/<tspan font-style="italic">dx</tspan>
    </text>
  </g>

  <!-- Title / Figure label -->
  <text x="50" y="35" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#1c1c1c">Fig. 6 — Unified Model &amp; Parameter Identification</text>
</svg>
