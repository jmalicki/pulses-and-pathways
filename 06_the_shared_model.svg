<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f2efe3" />
  <line x1="30" y1="36" x2="490" y2="36" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="30" y1="252" x2="490" y2="252" stroke="#e8e2d8" stroke-width="1" stroke-dasharray="8,8" />

  <text x="40" y="28" font-family="Georgia, serif" font-size="15" font-weight="bold" fill="#1c1c1c">Unused — One Circuit, Two Namings</text>

  <g transform="translate(0, 42)">
    <text x="40" y="14" font-family="Georgia, serif" font-size="12" fill="#5a5a5a">Medicine above · petroleum below</text>

    <!-- Medicine labels: more air under the legend, tight above C/P -->
    <text x="48" y="64" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">Heart</text>
    <text x="125" y="56" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">Arterial</text>
    <text x="125" y="68" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">stretch</text>
    <text x="200" y="64" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">Stenosis</text>
    <text x="275" y="56" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">Arterial</text>
    <text x="275" y="68" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">line</text>
    <text x="355" y="56" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">Capillary</text>
    <text x="355" y="68" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">bed</text>
    <text x="445" y="56" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">Venous</text>
    <text x="445" y="68" font-family="Georgia, serif" font-size="10" fill="#1c1c1c" text-anchor="middle">return</text>

    <!-- Circuit: C top ~10px under "stretch" -->
    <g transform="translate(0, 76)">
      <circle cx="48" cy="52" r="15" fill="none" stroke="#1e3d59" stroke-width="2" />
      <path d="M 41 52 L 55 46 L 55 58 Z" fill="#1e3d59" />

      <line x1="63" y1="52" x2="125" y2="52" stroke="#1e3d59" stroke-width="2" />

      <circle cx="125" cy="52" r="2.5" fill="#1e3d59" />
      <line x1="125" y1="52" x2="125" y2="34" stroke="#1e3d59" stroke-width="2" />
      <rect x="113" y="10" width="24" height="24" fill="none" stroke="#1e3d59" stroke-width="2" rx="2" />
      <line x1="115" y1="22" x2="135" y2="22" stroke="#1e3d59" stroke-width="2" />
      <text x="142" y="20" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#1e3d59">C</text>

      <line x1="125" y1="52" x2="175" y2="52" stroke="#1e3d59" stroke-width="2" />

      <path d="M 175 52 L 186 44 L 186 60 L 197 52 Z" fill="#1e3d59" />
      <text x="186" y="38" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#1e3d59" text-anchor="middle">R</text>

      <line x1="197" y1="52" x2="275" y2="52" stroke="#1e3d59" stroke-width="2" />

      <circle cx="275" cy="52" r="3" fill="#1e3d59" />
      <line x1="275" y1="52" x2="275" y2="34" stroke="#1c1c1c" stroke-width="1.2" />
      <rect x="256" y="14" width="38" height="18" fill="#f2efe3" stroke="#1c1c1c" stroke-width="1.5" />
      <text x="275" y="27" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#1c1c1c" text-anchor="middle">P</text>

      <line x1="275" y1="52" x2="320" y2="52" stroke="#1e3d59" stroke-width="2" />

      <line x1="320" y1="34" x2="320" y2="70" stroke="#1e3d59" stroke-width="2" />
      <line x1="320" y1="34" x2="380" y2="34" stroke="#1e3d59" stroke-width="2" />
      <line x1="320" y1="52" x2="380" y2="52" stroke="#1e3d59" stroke-width="2" />
      <line x1="320" y1="70" x2="380" y2="70" stroke="#1e3d59" stroke-width="2" />
      <line x1="380" y1="34" x2="380" y2="70" stroke="#1e3d59" stroke-width="2" />
      <line x1="380" y1="52" x2="420" y2="52" stroke="#1e3d59" stroke-width="2" />

      <rect x="420" y="38" width="50" height="28" fill="none" stroke="#1e3d59" stroke-width="2" />
    </g>

    <!-- Petroleum: clear of parallel/sump, not as loose as the first draft -->
    <text x="48" y="176" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Pump</text>
    <text x="125" y="168" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Surge</text>
    <text x="125" y="180" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">tank</text>
    <text x="200" y="176" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Choke</text>
    <text x="275" y="176" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Transducer</text>
    <text x="355" y="168" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Fracture</text>
    <text x="355" y="180" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">network</text>
    <text x="445" y="176" font-family="Georgia, serif" font-size="10" fill="#5a5a5a" text-anchor="middle">Sump</text>
  </g>
</svg>
